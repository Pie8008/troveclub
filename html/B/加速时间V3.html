<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奢龙加速时间</title>
    <link rel="stylesheet" href="../../css/none.css">
    <link rel="stylesheet" href="../../css/V3.css">
    <style>
        /* 自定义样式 */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(185, 150, 255, 0.3);
        }

        h1 {
            color: rgb(225, 90, 250);
            margin-bottom: 10px;
        }

        .description {
            color: #c0c5d0;
            font-size: 16px;
            max-width: 700px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            gap: 15px;
        }

        select {
            padding: 10px 15px;
            border: 1px solid rgba(185, 150, 255, 0.3);
            border-radius: 6px;
            font-size: 16px;
            background-color: #1a1f2e;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:focus {
            outline: none;
            border-color: rgb(225, 90, 250);
            box-shadow: 0 0 0 2px rgba(225, 90, 250, 0.2);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .color-1 {
            background-color: #3498db;
        }

        .color-2 {
            background-color: #e74c3c;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background-color: #1a1f2e;
            border-radius: 6px;
            border: 1px solid rgba(185, 150, 255, 0.2);
        }

        .day {
            height: 90px;
            padding: 8px;
            border-radius: 6px;
            background-color: #1a1f2e;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s;
            border: 1px solid rgba(185, 150, 255, 0.1);
            position: relative;
        }

        .day:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-color: rgba(225, 90, 250, 0.3);
        }

        .day-number {
            font-weight: bold;
            font-size: 18px;
        }

        .time-display {
            font-size: 14px;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            margin-top: 5px;
        }

        .time-1 {
            background-color: rgba(52, 152, 219, 0.2);
        }

        .time-2 {
            background-color: rgba(231, 76, 60, 0.2);
        }

        .time-3 {
            background-color: rgba(46, 204, 113, 0.2);
        }

        .time-4 {
            background-color: rgba(155, 89, 182, 0.2);
        }

        .time-5 {
            background-color: rgba(241, 196, 15, 0.2);
        }

        .time-6 {
            background-color: rgba(230, 126, 34, 0.2);
        }

        .time-7 {
            background-color: rgba(52, 73, 94, 0.2);
        }

        .time-8 {
            background-color: rgba(149, 165, 166, 0.2);
        }

        .time-none {
            background-color: rgba(127, 140, 141, 0.1);
            color: #7f8c8d;
        }

        .empty-day {
            background-color: transparent;
            border: none;
        }

        .current-month {
            background-color: #1a1f2e;
            border: 1px solid rgba(185, 150, 255, 0.3);
        }

        .other-month {
            background-color: #121826;
            color: #6c757d;
        }

        .summary {
            background-color: #1a1f2e;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border: 1px solid rgba(185, 150, 255, 0.2);
        }

        .summary h3 {
            margin-bottom: 15px;
            color: rgb(225, 90, 250);
        }

        .summary-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .summary-item {
            padding: 10px;
            border-radius: 6px;
        }

        .time-schedule {
            background-color: rgba(52, 152, 219, 0.1);
            border-left: 3px solid #3498db;
        }

        .cycle-info {
            background-color: rgba(155, 89, 182, 0.1);
            border-left: 3px solid #9b59b6;
        }

        /* 当前日期指示器样式 */
        .current-day {
            position: relative;
            border: 2px solid #FFD700 !important;
            box-shadow: 0 0 10px #FFD700, inset 0 0 5px rgba(255, 215, 0, 0.3) !important;
            animation: pulse 2s infinite;
        }

        .current-day::before {
            content: "今天";
            position: absolute;
            top: -10px;
            right: -5px;
            background-color: #FFD700;
            color: #1a1f2e;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            z-index: 10;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 5px #FFD700, inset 0 0 5px rgba(255, 215, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 15px #FFD700, inset 0 0 10px rgba(255, 215, 0, 0.5);
            }
            100% {
                box-shadow: 0 0 5px #FFD700, inset 0 0 5px rgba(255, 215, 0, 0.3);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .calendar {
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
            }

            .day {
                height: 80px;
                padding: 5px;
            }

            .summary-list {
                grid-template-columns: 1fr;
            }

            .time-display {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .legend {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .controls {
                flex-direction: column;
                align-items: center;
            }

            .day {
                height: 70px;
            }

            .day-number {
                font-size: 12px;
            }

            .time-display {
                height: 50%;
                font-size: 12px;
                padding: 2px;
            }

            
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="container">
            <header>
                <h1>奢龙加速时间</h1>
            </header>

            <div class="content-card">
                <div class="card-title">日期选择&时间段</div>
                <div class="card-body">
                    <div class="controls">
                        <select id="year-select">
                            <!-- 年份选项将通过JavaScript动态生成 -->
                        </select>
                        <select id="month-select">
                            <!-- 月份选项将通过JavaScript动态生成 -->
                        </select>
                    </div>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="color-box color-1"></div>
                            <span>上半天 (1:00, 4:00, 7:00, 10:00)</span>
                        </div>
                        <div class="legend-item">
                            <div class="color-box color-2"></div>
                            <span>下半天 (13:00, 16:00, 19:00, 22:00)</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="content-card">
                <div class="card-title">日历</div>
                <div class="card-body">
                    <div class="calendar" id="calendar">
                        <!-- 日历内容将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>


        </div>
    </div>

    <script>
        // 初始日期：2025年10月13日
        const startDate = new Date(2025, 9, 13); // 注意：月份从0开始，所以10月是9

        // 时间循环数组
        const timeCycle = [
            "1:00", "4:00", "7:00", "10:00",
            "13:00", "16:00", "19:00", "22:00", "None"
        ];

        // 获取DOM元素
        const yearSelect = document.getElementById('year-select');
        const monthSelect = document.getElementById('month-select');
        const calendar = document.getElementById('calendar');

        // 填充年份选项（2025-2030）
        const currentYear = new Date().getFullYear();
        for (let year = 2025; year <= 2030; year++) {
            const option = document.createElement('option');
            option.value = year;
            option.textContent = year + '年';
            if (year === currentYear) {
                option.selected = true;
            }
            yearSelect.appendChild(option);
        }

        // 填充月份选项
        for (let month = 0; month < 12; month++) {
            const option = document.createElement('option');
            option.value = month;
            option.textContent = (month + 1) + '月';
            if (month === new Date().getMonth()) {
                option.selected = true;
            }
            monthSelect.appendChild(option);
        }

        // 生成日历
        function generateCalendar() {
            const year = parseInt(yearSelect.value);
            const month = parseInt(monthSelect.value);

            // 清空日历
            calendar.innerHTML = '';

            // 添加星期标题
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            weekdays.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendar.appendChild(dayHeader);
            });

            // 获取当月第一天和最后一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // 计算第一天是星期几（0-6，0是星期日）
            const firstDayOfWeek = firstDay.getDay();

            // 添加上个月的空白日期
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'day empty-day';
                calendar.appendChild(emptyDay);
            }

            // 获取当前日期
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth();
            const currentYearToday = today.getFullYear();

            // 添加当月日期
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const currentDate = new Date(year, month, day);
                const dayElement = document.createElement('div');
                dayElement.className = 'day current-month';

                // 添加日期数字
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = day;
                dayElement.appendChild(dayNumber);

                // 检查是否是今天
                if (day === currentDay && month === currentMonth && year === currentYearToday) {
                    dayElement.classList.add('current-day');
                }

                // 计算从起始日期到当前日期的天数差
                const timeDiff = currentDate.getTime() - startDate.getTime();
                const daysDiff = Math.floor(timeDiff / (1000 * 3600 * 24));

                // 计算在循环中的位置
                if (daysDiff >= 0) {
                    const cycleIndex = daysDiff % timeCycle.length;
                    const timeText = timeCycle[cycleIndex];

                    // 添加时间显示
                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'time-display';

                    // 根据时间设置不同的样式类
                    if (timeText === "None") {
                        timeDisplay.className += ' time-none';
                    } else {
                        const hour = parseInt(timeText.split(':')[0]);
                        if (hour < 12) {
                            timeDisplay.className += ' time-1'; // 上午时间
                        } else {
                            timeDisplay.className += ' time-2'; // 下午时间
                        }
                    }

                    timeDisplay.textContent = timeText;
                    dayElement.appendChild(timeDisplay);
                } else {
                    // 起始日期之前的时间
                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'time-display time-none';
                    timeDisplay.textContent = "过去";
                    dayElement.appendChild(timeDisplay);
                }

                calendar.appendChild(dayElement);
            }
        }

        // 初始化日历
        generateCalendar();

        // 添加事件监听器
        yearSelect.addEventListener('change', generateCalendar);
        monthSelect.addEventListener('change', generateCalendar);

        // 每天午夜更新当前日期指示器
        function updateCurrentDayIndicator() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            
            const timeUntilMidnight = tomorrow.getTime() - now.getTime();
            
            setTimeout(function() {
                generateCalendar();
                // 设置下一次更新
                updateCurrentDayIndicator();
            }, timeUntilMidnight + 1000); // 多加1秒确保已经过了午夜
        }

        // 启动自动更新
        updateCurrentDayIndicator();
    </script>
</body>

</html>
