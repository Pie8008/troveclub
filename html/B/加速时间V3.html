<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奢龙加速时间</title>
    <link rel="stylesheet" href="../../css/none.css">
    <link rel="stylesheet" href="../../css/V3.css">
    <style>
        /* 自定义样式 */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(185, 150, 255, 0.3);
        }

        h1 {
            color: rgb(225, 90, 250);
            margin-bottom: 10px;
        }

        .description {
            color: #c0c5d0;
            font-size: 16px;
            max-width: 700px;
            margin: 0 auto;
        }

        .calendar-section {
            margin-bottom: 30px;
        }

        .calendar-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(185, 150, 255, 0.2);
        }

        .month-buttons {
            display: flex;
            gap: 10px;
            /* 不需要额外调整，默认就在左侧 */
        }

        .month-btn {
            padding: 10px 20px;
            border: 1px solid rgba(185, 150, 255, 0.3);
            border-radius: 6px;
            font-size: 16px;
            background-color: #1a1f2e;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 100px;
            text-align: center;
        }

        .month-btn:hover {
            background-color: rgba(185, 150, 255, 0.1);
            border-color: rgb(225, 90, 250);
        }

        .month-btn.active {
            background-color: rgba(225, 90, 250, 0.2);
            border-color: rgb(225, 90, 250);
            color: rgb(225, 90, 250);
        }

        .current-month-label {
            font-size: 18px;
            font-weight: bold;
            color: rgb(225, 90, 250);
            text-align: right;
            /* 改为右对齐 */
            /* flex-grow: 1; 移除这行 */
            margin-left: auto;
            /* 添加这行，推到最右侧 */
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .color-1 {
            background-color: #1abc9c;
            /* 凌晨 */
        }

        .color-2 {
            background-color: #3498db;
            /* 上午 */
        }

        .color-3 {
            background-color: #e74c3c;
            /* 下午 */
        }

        .color-4 {
            background-color: #9b59b6;
            /* 晚上 */
        }

        .color-5 {
            background-color: #7f8c8d;
            /* 无 */
        }







        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background-color: #1a1f2e;
            border-radius: 6px;
            border: 1px solid rgba(185, 150, 255, 0.2);
        }

        .day {
            height: 90px;
            padding: 8px;
            border-radius: 6px;
            background-color: #1a1f2e;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s;
            border: 1px solid rgba(185, 150, 255, 0.1);
            position: relative;
        }

        .day:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-color: rgba(225, 90, 250, 0.3);
        }

        .day-number {
            font-weight: bold;
            font-size: 18px;
        }

        .time-display {
            font-size: 14px;
            text-align: center;
            padding: 4px;
            border-radius: 4px;
            margin-top: 5px;
            font-weight: bold;
        }

        .time-1 {
            background-color: rgba(26, 188, 156, 0.3);
            /* 凌晨 */
            color: #1abc9c;
            border-left: 3px solid #1abc9c;
        }

        .time-2 {
            background-color: rgba(52, 152, 219, 0.3);
            /* 上午 */
            color: #3498db;
            border-left: 3px solid #3498db;
        }

        .time-3 {
            background-color: rgba(231, 76, 60, 0.3);
            /* 下午 */
            color: #e74c3c;
            border-left: 3px solid #e74c3c;
        }

        .time-4 {
            background-color: rgba(155, 89, 182, 0.3);
            /* 晚上 */
            color: #9b59b6;
            border-left: 3px solid #9b59b6;
        }

        .time-none {
            background-color: rgba(127, 140, 141, 0.2);
            color: #7f8c8d;
            border-left: 3px solid #7f8c8d;
        }

        .empty-day {
            background-color: transparent;
            border: none;
        }

        .current-month {
            background-color: #1a1f2e;
            border: 1px solid rgba(185, 150, 255, 0.3);
        }

        .other-month {
            background-color: #121826;
            color: #6c757d;
        }

        /* 当前日期指示器样式 */
        .current-day {
            position: relative;
            border: 2px solid #FFD700 !important;
            box-shadow: 0 0 10px #FFD700, inset 0 0 5px rgba(255, 215, 0, 0.3) !important;
            animation: pulse 2s infinite;
        }

        .current-day::before {
            content: "今天";
            position: absolute;
            top: -10px;
            right: -5px;
            background-color: #FFD700;
            color: #1a1f2e;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 3px;
            z-index: 10;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 5px #FFD700, inset 0 0 5px rgba(255, 215, 0, 0.3);
            }

            50% {
                box-shadow: 0 0 15px #FFD700, inset 0 0 10px rgba(255, 215, 0, 0.5);
            }

            100% {
                box-shadow: 0 0 5px #FFD700, inset 0 0 5px rgba(255, 215, 0, 0.3);
            }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 768px) {
            .calendar {
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
            }

            .day {
                height: 80px;
                padding: 5px;
            }

            .calendar-controls {
                flex-direction: row;
                /* 保持行布局 */
                align-items: center;
            }

            .current-month-label {
                text-align: center;
                /* 移动端居中显示 */
                margin-left: 0;
                /* 移除自动边距 */
                width: 100%;
                /* 全宽度 */
                order: 3;
                /* 放到第三行 */
                margin-top: 10px;
            }

            .month-buttons {
                width: auto;
                /* 恢复自动宽度 */
                justify-content: flex-start;
                /* 左对齐 */
            }

            .month-btn {
                flex: 1;
                min-width: 0;
            }

            .time-display {
                font-size: 12px;
            }

            .legend {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }


        }

        @media (max-width: 480px) {
            .day {
                height: 70px;
            }

            .day-number {
                font-size: 12px;
            }

            .time-display {
                height: 50%;
                font-size: 10px;
                padding: 2px;
            }

            .month-buttons {
                justify-content: space-between;
                /* 小屏幕时按钮均匀分布 */
                width: 100%;
            }

            .month-btn {
                flex: 1;
            }



        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="container">
            <header>
                <h1>奢龙加速时间</h1>
                <div class="description">根据2025年10月13日计算</div>
            </header>

            <div class="content-card">
                <div class="card-title">日历</div>
                <div class="card-body">
                    <!-- 日历控制区域 -->
                    <div class="calendar-controls">
                        <div class="month-buttons">
                            <button class="month-btn active" id="current-month-btn">当前月</button>
                            <button class="month-btn" id="next-month-btn">下个月</button>
                        </div>
                        <div class="current-month-label" id="current-month-label">
                            <!-- 月份显示将通过JavaScript动态生成 -->
                        </div>
                    </div>

                    <!-- 图例说明 -->
                    <div class="legend">
                        <div class="legend-item">
                            <div class="color-box color-1"></div>
                            <span>凌晨（1:00、4:00）</span>
                        </div>
                        <div class="legend-item">
                            <div class="color-box color-2"></div>
                            <span>上午（7:00、10:00）</span>
                        </div>
                        <div class="legend-item">
                            <div class="color-box color-3"></div>
                            <span>下午（13:00、16:00）</span>
                        </div>
                        <div class="legend-item">
                            <div class="color-box color-4"></div>
                            <span>晚上（19:00、22:00）</span>
                        </div>
                    </div>

                    <!-- 日历内容 -->
                    <div class="calendar" id="calendar">
                        <!-- 日历内容将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始日期：2025年10月13日
        const startDate = new Date(2025, 9, 13); // 注意：月份从0开始，所以10月是9

        // 时间循环数组
        const timeCycle = [
            "1:00", "4:00", "7:00", "10:00",
            "13:00", "16:00", "19:00", "22:00", "None"
        ];

        // 获取DOM元素
        const currentMonthBtn = document.getElementById('current-month-btn');
        const nextMonthBtn = document.getElementById('next-month-btn');
        const currentMonthLabel = document.getElementById('current-month-label');
        const calendar = document.getElementById('calendar');

        // 当前显示的月份和年份
        let currentDisplayYear = new Date().getFullYear();
        let currentDisplayMonth = new Date().getMonth();

        // 更新月份标签
        function updateMonthLabel() {
            const monthNames = [
                '一月', '二月', '三月', '四月', '五月', '六月',
                '七月', '八月', '九月', '十月', '十一月', '十二月'
            ];
            currentMonthLabel.textContent = `${currentDisplayYear}年 ${monthNames[currentDisplayMonth]}`;
        }

        // 切换到当前月
        function switchToCurrentMonth() {
            const now = new Date();
            currentDisplayYear = now.getFullYear();
            currentDisplayMonth = now.getMonth();

            // 更新按钮状态
            currentMonthBtn.classList.add('active');
            nextMonthBtn.classList.remove('active');

            updateMonthLabel();
            generateCalendar();
        }

        // 切换到下个月
        function switchToNextMonth() {
            // 计算下个月
            let nextMonth = currentDisplayMonth + 1;
            let nextYear = currentDisplayYear;

            if (nextMonth > 11) {
                nextMonth = 0;
                nextYear += 1;
            }

            currentDisplayYear = nextYear;
            currentDisplayMonth = nextMonth;

            // 更新按钮状态
            currentMonthBtn.classList.remove('active');
            nextMonthBtn.classList.add('active');

            updateMonthLabel();
            generateCalendar();
        }

        // 根据时间获取对应的CSS类名
        function getTimeClass(timeText) {
            if (timeText === "None") {
                return 'time-none';
            }

            const hour = parseInt(timeText.split(':')[0]);

            // 凌晨：1:00、4:00
            if (hour === 1 || hour === 4) {
                return 'time-1';
            }
            // 上午：7:00、10:00
            else if (hour === 7 || hour === 10) {
                return 'time-2';
            }
            // 下午：13:00、16:00
            else if (hour === 13 || hour === 16) {
                return 'time-3';
            }
            // 晚上：19:00、22:00
            else if (hour === 19 || hour === 22) {
                return 'time-4';
            }

            return 'time-none';
        }

        // 生成日历
        function generateCalendar() {
            const year = currentDisplayYear;
            const month = currentDisplayMonth;

            // 清空日历
            calendar.innerHTML = '';

            // 添加星期标题
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            weekdays.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendar.appendChild(dayHeader);
            });

            // 获取当月第一天和最后一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // 计算第一天是星期几（0-6，0是星期日）
            const firstDayOfWeek = firstDay.getDay();

            // 添加上个月的空白日期
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'day empty-day';
                calendar.appendChild(emptyDay);
            }

            // 获取当前日期
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonthToday = today.getMonth();
            const currentYearToday = today.getFullYear();

            // 添加当月日期
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const currentDate = new Date(year, month, day);
                const dayElement = document.createElement('div');
                dayElement.className = 'day current-month';

                // 添加日期数字
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = day;
                dayElement.appendChild(dayNumber);

                // 检查是否是今天
                if (day === currentDay && month === currentMonthToday && year === currentYearToday) {
                    dayElement.classList.add('current-day');
                }

                // 计算从起始日期到当前日期的天数差
                const timeDiff = currentDate.getTime() - startDate.getTime();
                const daysDiff = Math.floor(timeDiff / (1000 * 3600 * 24));

                // 计算在循环中的位置
                if (daysDiff >= 0) {
                    const cycleIndex = daysDiff % timeCycle.length;
                    const timeText = timeCycle[cycleIndex];

                    // 添加时间显示
                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'time-display';

                    // 获取对应的CSS类名
                    const timeClass = getTimeClass(timeText);
                    timeDisplay.classList.add(timeClass);

                    timeDisplay.textContent = timeText;
                    dayElement.appendChild(timeDisplay);
                } else {
                    // 起始日期之前的时间
                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'time-display time-none';
                    timeDisplay.textContent = "过去";
                    dayElement.appendChild(timeDisplay);
                }

                calendar.appendChild(dayElement);
            }
        }

        // 初始化
        updateMonthLabel();
        generateCalendar();

        // 添加事件监听器
        currentMonthBtn.addEventListener('click', switchToCurrentMonth);
        nextMonthBtn.addEventListener('click', switchToNextMonth);

        // 每天午夜更新当前日期指示器
        function updateCurrentDayIndicator() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            const timeUntilMidnight = tomorrow.getTime() - now.getTime();

            setTimeout(function () {
                // 如果当前显示的是当前月，则重新生成日历
                if (currentMonthBtn.classList.contains('active')) {
                    generateCalendar();
                }
                // 设置下一次更新
                updateCurrentDayIndicator();
            }, timeUntilMidnight + 1000); // 多加1秒确保已经过了午夜
        }

        // 启动自动更新
        updateCurrentDayIndicator();
    </script>
</body>

</html>
