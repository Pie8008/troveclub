<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奢龙加速时间</title>
    <link rel="stylesheet" href="../../css/none.css">
    <link rel="stylesheet" href="../../css/color.css">
    <style>

        body {
            min-height: 100vh;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes cardAppear {
            from {
                transform: translateY(20px) scale(0.9);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes pulse-border {
            0% {
                box-shadow: 0 0 0 0 rgba(var(--accent-primary-rgb), 0.4);
                border-color: rgba(var(--accent-primary-rgb), 1);
            }

            50% {
                box-shadow: 0 0 0 4px rgba(var(--accent-primary-rgb), 0.2);
                border-color: rgba(var(--accent-primary-rgb), 0.8);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(var(--accent-primary-rgb), 0.4);
                border-color: rgba(var(--accent-primary-rgb), 1);
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        /* 头部区域 */
        header {
            text-align: center;
            animation: slideInUp 0.6s ease-out 0.2s both;
        }

        h1 {
            color: var(--accent-primary);
            margin-bottom: 30px;
            font-size: 2rem;
            text-shadow: 0 0 10px var(--shadow-accent);
        }

        /* 卡片样式 - 与二级菜单页统一 */
        .content-card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 12px var(--shadow-primary);
            border: 1px solid var(--border-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardAppear 0.5s ease-out 0.3s both;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .content-card:hover {
            border-color: var(--accent-secondary);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow-primary);
        }

        /* 标题区域 */
        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-primary);
            text-shadow: 0 0 5px var(--shadow-accent);
        }

        /* 日历控制区域 */
        .calendar-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-primary);
        }

        .month-buttons {
            display: flex;
            gap: 10px;
        }

        .month-btn {
            padding: 10px 20px;
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            font-size: 16px;
            background-color: var(--secondary-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 100px;
            text-align: center;
            font-weight: 500;
        }

        .month-btn:hover {
            background-color: var(--accent-primary-transparent);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-primary);
        }

        .month-btn.active {
            background-color: var(--accent-primary-transparent);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            font-weight: 600;
        }

        .month-btn:active {
            transform: translateY(0) scale(0.98);
        }

        .current-month-label {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-primary);
            text-align: right;
            margin-left: auto;
            text-shadow: 0 0 5px var(--shadow-accent);
        }

        /* 图例说明 */
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background-color: var(--tertiary-bg);
            border-radius: 8px;
            border: 1px solid var(--border-primary);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s ease;
        }

        .legend-item:hover {
            transform: scale(1.05);
        }

        .color-box {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--border-primary);
            box-shadow: 0 2px 4px var(--shadow-primary);
        }

        .color-1 {
            background-color: #1abc9c;
        }

        .color-2 {
            background-color: #3498db;
        }

        .color-3 {
            background-color: #e74c3c;
        }

        .color-4 {
            background-color: #9b59b6;
        }

        .color-5 {
            background-color: #7f8c8d;
        }

        /* 日历网格 */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-bottom: 30px;
        }

        .day-header {
            text-align: center;
            font-weight: bold;
            padding: 12px;
            background-color: var(--tertiary-bg);
            border-radius: 8px;
            border: 1px solid var(--border-primary);
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .day {
            height: 100px;
            padding: 10px;
            border-radius: 8px;
            background-color: var(--secondary-bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-primary);
            position: relative;
            
        }

        .day:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px var(--shadow-primary);
            border-color: var(--accent-primary);
            z-index: 1;
        }


        .day-number {
            font-weight: bold;
            font-size: 18px;
            color: var(--text-primary);
            position: relative;
            z-index: 2;
        }

        .time-display {
            font-size: 14px;
            text-align: center;
            padding: 6px;
            border-radius: 6px;
            margin-top: 5px;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .time-1 {
            background-color: rgba(26, 188, 156, 0.3);
            color: #1abc9c;
            border-left: 3px solid #1abc9c;
        }

        .time-2 {
            background-color: rgba(52, 152, 219, 0.3);
            color: #3498db;
            border-left: 3px solid #3498db;
        }

        .time-3 {
            background-color: rgba(231, 76, 60, 0.3);
            color: #e74c3c;
            border-left: 3px solid #e74c3c;
        }

        .time-4 {
            background-color: rgba(155, 89, 182, 0.3);
            color: #9b59b6;
            border-left: 3px solid #9b59b6;
        }

        .time-none {
            background-color: rgba(127, 140, 141, 0.2);
            color: var(--text-muted);
            border-left: 3px solid var(--text-muted);
        }

        .empty-day {
            background-color: transparent;
            border: none;
            pointer-events: none;
        }

        .current-month {
            background-color: var(--secondary-bg);
        }

        .other-month {
            background-color: var(--tertiary-bg);
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* 当前日期指示器样式 - 修复版 */
        .current-day {
            position: relative;
            border: 2px solid var(--accent-primary) !important;
            animation: pulse-border 2s infinite;
            z-index: 2;
        }

        /* "今天"标签样式 */
        .today-badge {
            position: absolute;
            top: -5px;
            /* 减小负值，避免被父元素切割 */
            right: -5px;
            /* 减小负值，避免被父元素切割 */
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--text-light);
            font-size: 11px;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            z-index: 10;
            box-shadow: 0 2px 6px var(--shadow-primary);
            animation: slideDown 0.3s ease-out;
            min-width: 40px;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            white-space: nowrap;
        }

        /* 当前日期的日期数字特殊样式 */
        .current-day .day-number {
            color: var(--accent-primary);
            font-weight: 800;
            text-shadow: 0 0 5px rgba(var(--accent-primary-rgb), 0.3);
        }

        /* ===== 响应式设计 ===== */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .calendar {
                grid-template-columns: repeat(7, 1fr);
                gap: 5px;
            }

            .day {
                height: 85px;
                padding: 8px;
            }

            .calendar-controls {
                flex-direction: row;
            }

            .current-month-label {
                text-align: center;
                margin-left: 0;
                width: 100%;
                order: 3;
                margin-top: 10px;
            }

            .month-buttons {
                justify-content: space-between;
                width: 100%;
            }

            .month-btn {
                flex: 1;
                min-width: 0;
                padding: 8px 12px;
                font-size: 14px;
            }

            .time-display {
                font-size: 12px;
                padding: 4px;
            }

            .legend {
                flex-direction: column;
                align-items: center;
                gap: 10px;
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .card-title {
                font-size: 1.2rem;
            }

            .today-badge {
                font-size: 10px;
                padding: 2px 6px;
                min-width: 36px;
                top: -4px;
                /* 移动端进一步减小负值 */
                right: -4px;
                /* 移动端进一步减小负值 */
            }
        }

        @media (max-width: 480px) {
            .day {
                height: 75px;
                padding: 6px;
            }

            .day-number {
                font-size: 14px;
            }

            .time-display {
                font-size: 11px;
                padding: 3px;
            }

            .month-buttons {
                flex-direction: column;
                gap: 8px;
            }

            .legend {
                gap: 8px;
                padding: 8px;
            }

            .legend-item {
                font-size: 12px;
            }

            .color-box {
                width: 20px;
                height: 20px;
            }

            .today-badge {
                font-size: 9px;
                padding: 1px 4px;
                min-width: 32px;
                top: -3px;
                /* 小屏幕再减小负值 */
                right: -3px;
                /* 小屏幕再减小负值 */
            }
        }

        /* 横屏优化 */
        @media (max-height: 600px) and (orientation: landscape) {
            .day {
                height: 80px;
            }

            .time-display {
                font-size: 11px;
                padding: 3px;
            }

            .today-badge {
                font-size: 9px;
                padding: 2px 5px;
            }
        }
    </style>
</head>

<body>
    <div class="container custom-scrollbar">
        <header>
            <h1>奢龙加速时间</h1>
        </header>

        <div class="content-card">
            <div class="card-title">日历</div>
            <div class="card-body">
                <!-- 日历控制区域 -->
                <div class="calendar-controls">
                    <div class="month-buttons">
                        <button class="month-btn active" id="current-month-btn">当前月</button>
                        <button class="month-btn" id="next-month-btn">下个月</button>
                    </div>
                    <div class="current-month-label" id="current-month-label">
                        <!-- 月份显示将通过JavaScript动态生成 -->
                    </div>
                </div>

                <!-- 图例说明 -->
                <div class="legend">
                    <div class="legend-item">
                        <div class="color-box color-1"></div>
                        <span>凌晨（1:00、4:00）</span>
                    </div>
                    <div class="legend-item">
                        <div class="color-box color-2"></div>
                        <span>上午（7:00、10:00）</span>
                    </div>
                    <div class="legend-item">
                        <div class="color-box color-3"></div>
                        <span>下午（13:00、16:00）</span>
                    </div>
                    <div class="legend-item">
                        <div class="color-box color-4"></div>
                        <span>晚上（19:00、22:00）</span>
                    </div>
                </div>

                <!-- 日历内容 -->
                <div class="calendar" id="calendar">
                    <!-- 日历内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 监听父窗口的主题变化
         */
        function listenToParentThemeChanges() {
            // 检查是否在iframe中
            if (window.parent !== window) {
                // 监听存储变化（父窗口主题变化会更新localStorage）
                window.addEventListener('storage', function (e) {
                    if (e.key === 'preferred-theme') {
                        applyThemeFromParent(e.newValue);
                    }
                });

                // 初始应用父窗口主题
                const parentTheme = localStorage.getItem('preferred-theme') || 'default';
                applyThemeFromParent(parentTheme);
            }
        }

        /**
         * 应用父窗口的主题
         * @param {string} theme - 主题名称
         */
        function applyThemeFromParent(theme) {
            if (theme === 'default') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', theme);
            }

            // 添加主题切换动画
            document.body.style.transition = 'all 0.5s ease';
            setTimeout(() => {
                document.body.style.transition = '';
            }, 500);
        }

        // 初始日期：2025年10月13日
        const startDate = new Date(2025, 9, 13); // 注意：月份从0开始，所以10月是9

        // 时间循环数组
        const timeCycle = [
            "1:00", "4:00", "7:00", "10:00",
            "13:00", "16:00", "19:00", "22:00", "None"
        ];

        // 获取DOM元素
        const currentMonthBtn = document.getElementById('current-month-btn');
        const nextMonthBtn = document.getElementById('next-month-btn');
        const currentMonthLabel = document.getElementById('current-month-label');
        const calendar = document.getElementById('calendar');

        // 当前显示的月份和年份
        let currentDisplayYear = new Date().getFullYear();
        let currentDisplayMonth = new Date().getMonth();

        // 更新月份标签
        function updateMonthLabel() {
            const monthNames = [
                '一月', '二月', '三月', '四月', '五月', '六月',
                '七月', '八月', '九月', '十月', '十一月', '十二月'
            ];
            currentMonthLabel.textContent = `${currentDisplayYear}年 ${monthNames[currentDisplayMonth]}`;
        }

        // 切换到当前月
        function switchToCurrentMonth() {
            const now = new Date();
            currentDisplayYear = now.getFullYear();
            currentDisplayMonth = now.getMonth();

            // 更新按钮状态
            currentMonthBtn.classList.add('active');
            nextMonthBtn.classList.remove('active');

            updateMonthLabel();
            generateCalendar();
        }

        // 切换到下个月
        function switchToNextMonth() {
            // 计算下个月
            let nextMonth = currentDisplayMonth + 1;
            let nextYear = currentDisplayYear;

            if (nextMonth > 11) {
                nextMonth = 0;
                nextYear += 1;
            }

            currentDisplayYear = nextYear;
            currentDisplayMonth = nextMonth;

            // 更新按钮状态
            currentMonthBtn.classList.remove('active');
            nextMonthBtn.classList.add('active');

            updateMonthLabel();
            generateCalendar();
        }

        // 根据时间获取对应的CSS类名
        function getTimeClass(timeText) {
            if (timeText === "None") {
                return 'time-none';
            }

            const hour = parseInt(timeText.split(':')[0]);

            // 凌晨：1:00、4:00
            if (hour === 1 || hour === 4) {
                return 'time-1';
            }
            // 上午：7:00、10:00
            else if (hour === 7 || hour === 10) {
                return 'time-2';
            }
            // 下午：13:00、16:00
            else if (hour === 13 || hour === 16) {
                return 'time-3';
            }
            // 晚上：19:00、22:00
            else if (hour === 19 || hour === 22) {
                return 'time-4';
            }

            return 'time-none';
        }

        // 创建今天标签
        function createTodayBadge() {
            const badge = document.createElement('div');
            badge.className = 'today-badge';
            badge.textContent = '今天';
            return badge;
        }

        // 生成日历
        function generateCalendar() {
            const year = currentDisplayYear;
            const month = currentDisplayMonth;

            // 清空日历
            calendar.innerHTML = '';

            // 添加星期标题
            const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
            weekdays.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'day-header';
                dayHeader.textContent = day;
                calendar.appendChild(dayHeader);
            });

            // 获取当月第一天和最后一天
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);

            // 计算第一天是星期几（0-6，0是星期日）
            const firstDayOfWeek = firstDay.getDay();

            // 添加上个月的空白日期
            for (let i = 0; i < firstDayOfWeek; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'day empty-day';
                calendar.appendChild(emptyDay);
            }

            // 获取当前日期
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonthToday = today.getMonth();
            const currentYearToday = today.getFullYear();

            // 添加当月日期
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const currentDate = new Date(year, month, day);
                const dayElement = document.createElement('div');
                dayElement.className = 'day current-month';

                // 添加日期数字
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = day;
                dayElement.appendChild(dayNumber);

                // 检查是否是今天
                const isToday = (day === currentDay && month === currentMonthToday && year === currentYearToday);
                if (isToday) {
                    dayElement.classList.add('current-day');

                    // 添加"今天"标签
                    const todayBadge = createTodayBadge();
                    dayElement.appendChild(todayBadge);
                }

                // 计算从起始日期到当前日期的天数差
                const timeDiff = currentDate.getTime() - startDate.getTime();
                const daysDiff = Math.floor(timeDiff / (1000 * 3600 * 24));

                // 计算在循环中的位置
                if (daysDiff >= 0) {
                    const cycleIndex = daysDiff % timeCycle.length;
                    const timeText = timeCycle[cycleIndex];

                    // 添加时间显示
                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'time-display';

                    // 获取对应的CSS类名
                    const timeClass = getTimeClass(timeText);
                    timeDisplay.classList.add(timeClass);

                    timeDisplay.textContent = timeText;
                    dayElement.appendChild(timeDisplay);
                } else {
                    // 起始日期之前的时间
                    const timeDisplay = document.createElement('div');
                    timeDisplay.className = 'time-display time-none';
                    timeDisplay.textContent = "过去";
                    dayElement.appendChild(timeDisplay);
                }

                calendar.appendChild(dayElement);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 监听父窗口主题变化
            listenToParentThemeChanges();

            updateMonthLabel();
            generateCalendar();

            // 添加事件监听器
            currentMonthBtn.addEventListener('click', switchToCurrentMonth);
            nextMonthBtn.addEventListener('click', switchToNextMonth);

            // 添加点击动画
            const buttons = [currentMonthBtn, nextMonthBtn];
            buttons.forEach(btn => {
                btn.addEventListener('click', function () {
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);
                });
            });

            // 添加页面加载动画
            document.body.style.opacity = '0';
            document.body.style.transform = 'translateY(10px)';
            document.body.style.transition = 'all 0.5s ease';

            setTimeout(() => {
                document.body.style.opacity = '1';
                document.body.style.transform = 'translateY(0)';
            }, 100);

            // 每天午夜更新当前日期指示器
            updateCurrentDayIndicator();
        });

        // 每天午夜更新当前日期指示器
        function updateCurrentDayIndicator() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);

            const timeUntilMidnight = tomorrow.getTime() - now.getTime();

            setTimeout(function () {
                // 如果当前显示的是当前月，则重新生成日历
                if (currentMonthBtn.classList.contains('active')) {
                    generateCalendar();
                }
                // 设置下一次更新
                updateCurrentDayIndicator();
            }, timeUntilMidnight + 1000); // 多加1秒确保已经过了午夜
        }
    </script>
    <script src="../../js/security.js"></script>
</body>

</html>
