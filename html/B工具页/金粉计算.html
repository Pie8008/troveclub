<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奢龙试炼金粉需求计算器</title>
    <!-- 引入统一的颜色系统 -->
     <link rel="stylesheet" href="../../css/none.css">
    <link rel="stylesheet" href="../../css/color.css">
    <style>


        body {
            min-height: 100vh;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes cardAppear {
            from {
                transform: translateY(20px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }


        /* 主容器 */
        .main-content {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        /* 计算器卡片 */
        .calculator-card {
            background-color: var(--secondary-bg);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 12px var(--shadow-primary);
            border: 1px solid var(--border-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: cardAppear 0.5s ease-out 0.3s both;
            border-color: var(--accent-primary);
        }

        .calculator-card:hover {
            border-color: var(--accent-secondary);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow-primary);
        }

        /* 标题 */
        .card-title {
            font-size: 1.5rem;
            margin-bottom: 25px;
            padding-bottom: 15px;
            text-align: center;
            color: var(--accent-primary);
            border-bottom: 2px solid var(--border-primary);
            font-weight: 600;
            text-shadow: 0 0 5px var(--shadow-accent);
        }

        /* 按钮组 */
        .button-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .cost-button {
            padding: 12px 5px;
            background-color: var(--tertiary-bg);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            font-weight: 500;
        }

        .cost-button:hover {
            background-color: var(--accent-primary-transparent);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow-primary);
        }

        .cost-button.active {
            background-color: var(--accent-primary-transparent);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            font-weight: 600;
        }

        .cost-button:active {
            transform: translateY(0) scale(0.98);
        }

        /* 输入组 */
        .input-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .input-group {
            flex: 1;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--primary-bg);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-primary-transparent);
            transform: translateY(-2px);
        }

        .input-field:invalid {
            border-color: var(--accent-danger);
        }

        /* 结果区域 */
        .result-section {
            margin-top: 30px;
            padding: 25px;
            background-color: var(--tertiary-bg);
            border-radius: 10px;
            border: 1px solid var(--border-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideInUp 0.6s ease-out 0.5s both;
        }

        .result-section:hover {
            border-color: var(--accent-secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px var(--shadow-primary);
        }

        .result-title {
            font-size: 1.2rem;
            color: var(--accent-primary);
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            text-shadow: 0 0 3px var(--shadow-accent);
        }

        .result-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-align: center;
            margin: 10px 0;
            transition: color 0.3s ease;
            text-shadow: 0 0 8px var(--shadow-accent);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-content {
                padding: 15px;
            }

            .calculator-card {
                padding: 25px;
            }

            .button-group {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }

            .input-row {
                flex-direction: column;
                gap: 15px;
            }

            .result-value {
                font-size: 1.8rem;
            }

            .card-title {
                font-size: 1.3rem;
            }
        }

        @media (max-width: 480px) {
            .calculator-card {
                padding: 20px;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .cost-button {
                padding: 15px;
            }

            .result-value {
                font-size: 1.6rem;
            }

            .result-section {
                padding: 20px;
            }

            .card-title {
                font-size: 1.2rem;
            }
        }

        /* 横屏优化 */
        @media (max-height: 600px) and (orientation: landscape) {
            .main-content {
                padding: 15px;
            }

            .calculator-card {
                max-width: 90%;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body>
    <div class="main-content">
        <div class="calculator-card">
            <h2 class="card-title">奢龙试炼金粉需求计算器</h2>

            <div class="button-group">
                <button class="cost-button active" data-count="4"
                    title="每制作4次，需求便会额外增加1点，如果你在起始消耗开始的需求中未制作过，请选择此选项。">未制作过</button>
                <button class="cost-button" data-count="3"
                    title="每制作4次，需求便会额外增加1点，如果你在起始消耗开始的需求中制作过1次，请选择此选项。">已制作1次</button>
                <button class="cost-button" data-count="2"
                    title="每制作4次，需求便会额外增加1点，如果你在起始消耗开始的需求中制作过2次，请选择此选项。">已制作2次</button>
                <button class="cost-button" data-count="1"
                    title="每制作4次，需求便会额外增加1点，如果你在起始消耗开始的需求中制作过3次，请选择此选项。">已制作3次</button>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label class="input-label" for="current-cost">起始消耗</label>
                    <input type="number" id="current-cost" class="input-field" min="7" value="7" required>
                </div>

                <div class="input-group">
                    <label class="input-label" for="quantity">制作数量</label>
                    <input type="number" id="quantity" class="input-field" min="1" value="1">
                </div>
            </div>

            <div class="result-section">
                <h3 class="result-title">消耗数量</h3>
                <div class="result-value" id="result">0</div>
            </div>
        </div>
    </div>

    <script>
        /**
         * 监听父窗口的主题变化
         */
        function listenToParentThemeChanges() {
            // 检查是否在iframe中
            if (window.parent !== window) {
                // 监听存储变化（父窗口主题变化会更新localStorage）
                window.addEventListener('storage', function (e) {
                    if (e.key === 'preferred-theme') {
                        applyThemeFromParent(e.newValue);
                    }
                });

                // 初始应用父窗口主题
                const parentTheme = localStorage.getItem('preferred-theme') || 'default';
                applyThemeFromParent(parentTheme);
            }
        }

        /**
         * 应用父窗口的主题
         * @param {string} theme - 主题名称
         */
        function applyThemeFromParent(theme) {
            if (theme === 'default') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', theme);
            }

            // 添加主题切换动画
            document.body.style.transition = 'all 0.5s ease';
            setTimeout(() => {
                document.body.style.transition = '';
            }, 500);
        }

        document.addEventListener('DOMContentLoaded', function () {
            // 监听父窗口主题变化
            listenToParentThemeChanges();

            const currentCostInput = document.getElementById('current-cost');
            const quantityInput = document.getElementById('quantity');
            const resultElement = document.getElementById('result');
            const costButtons = document.querySelectorAll('.cost-button');

            let currentCount = 4;

            // 按钮选择逻辑
            costButtons.forEach(button => {
                button.addEventListener('click', function () {
                    // 添加点击动画
                    this.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.style.transform = '';
                    }, 150);

                    // 移除所有按钮的active类
                    costButtons.forEach(btn => btn.classList.remove('active'));
                    // 为当前点击的按钮添加active类
                    this.classList.add('active');
                    // 更新当前计算次数
                    currentCount = parseInt(this.getAttribute('data-count'));
                    // 重新计算结果
                    calculateResult();
                });
            });

            // 当前消耗输入验证
            currentCostInput.addEventListener('change', function () {
                if (this.value < 7) {
                    this.value = 7;
                }
                calculateResult();
            });

            function calculateResult() {
                const x = parseInt(currentCostInput.value) || 7;
                const y = parseInt(quantityInput.value) || 1;

                let totalResult = 0;

                totalResult = calculateResulta(y, currentCount, x);

                // 更新显示
                resultElement.textContent = totalResult;
                
                // 添加结果更新动画
                resultElement.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    resultElement.style.transform = 'scale(1)';
                }, 150);
            }

            function calculateResulta(x, z, y) {
                let n;
                if (x <= z) {
                    n = 1;
                    return x * y;
                } else {
                    n = Math.ceil((x - z) / 4) + 1;
                    // 公式: R = x(n+6) - 2n² + 6n - z(n-1) - 4
                    return x * (n + 6) - 2 * n * n + 6 * n - z * (n - 1) - 4;
                }
            }

            // 添加输入事件监听
            currentCostInput.addEventListener('input', calculateResult);
            quantityInput.addEventListener('input', calculateResult);

            // 初始计算
            calculateResult();
            
            // 添加页面加载动画
            document.body.style.opacity = '0';
            document.body.style.transform = 'translateY(10px)';
            document.body.style.transition = 'all 0.5s ease';

            setTimeout(() => {
                document.body.style.opacity = '1';
                document.body.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
    <script src="../../js/security.js"></script>
</body>

</html>
