<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更多攻略</title>
    <link rel="stylesheet" href="../../css/none.css">
    <link rel="stylesheet" href="../../css/V3.css">
    <style>
        body {
            justify-content: center;
            align-items: center;
        }

        .tablet {
            width: 100vw;
            height: 100vh;
            background-color: #1a1f2e;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            border: 12px solid #0d111c;
        }

        .main-content {
            height: 100%;
            overflow-y: auto;
        }

        .main-content::-webkit-scrollbar {
            width: 5px;
        }

        .main-content::-webkit-scrollbar-track {
            background: #2a2f3e;
        }

        .main-content::-webkit-scrollbar-thumb {
            background: rgb(225, 90, 250);
            border-radius: 10px;
        }

        .main-content::-webkit-scrollbar-thumb:hover {
            background: #ffffff;
        }

        .content-cards {
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        }

        .content-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            height: 140px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
            border-radius: 16px;
            padding: 10px;
            width: 100%;
            height: 100%;
        }

        .app-icon:hover {
            transform: scale(1.05);
            background-color: rgba(225, 90, 250, 0.1);
        }

        .app-icon:active {
            transform: scale(0.95);
        }

        .app-icon img {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            margin-bottom: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            object-fit: cover; /* 确保图片缩放后保持比例 */
        }

        .app-name {
            font-size: 12px;
            color: #c0c5d0;
            text-align: center;
            font-weight: 500;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .content-cards {
                grid-template-columns: repeat(3, 1fr);
            }

            .tablet {
                width: 95%;
                height: 90vh;
            }
        }

        @media (max-width: 480px) {
            .content-cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .tablet {
                height: 95vh;
            }
        }
    </style>
</head>

<body>
    <div class="tablet">
        <div class="main-content">
            <div class="content-cards" id="app-grid">
            </div>
        </div>
    </div>

    <script>
        // 应用数据 - 现在支持imageUrl字段
        const apps = [
            { name: "公会攻略", color: "#007AFF", url: "https://promiscuouseden.notion.site/trove-index-aaaaa00000", imageUrl: "../../图片/杂项图标/公会图标.png" },
            { name: "TroveSaurus", color: "#FF9500", url: "https://trovesaurus.com/", imageUrl:"../../图片/杂项图标/sauruslogo.png" },
            { name: "TroveWiki", color: "#34C759", url: "https://trove.fandom.com/wiki/Trove_Wiki", imageUrl: "../../图片/杂项图标/Wilklogo.webp" },
            { name: "TroveGame", color: "#FF3B30", url: "https://trovegame.com/patch-notes/patch-notes-radiant-pathfinder-11-2025/", imageUrl:"../../图片/杂项图标/trovelogo.webp" },
            { name: "Glyph官网", color: "#5856D6", url: "https://glyph.trionworlds.com/", imageUrl:"../../图片/杂项图标/glyphlogo.png" },
            { name: "Glyph用户条款", color: "#123456", url: "https://www.glyph.net/en/terms-of-use-of-the-glyph-platform/", imageUrl:"../../图片/杂项图标/glyphlogo.png" },
            { name: "神奇", color: "#6A6A6A", url: "https://arcxingye.github.io/r18/index.html" },
            { name: "电脑开荒", color: "#7C7C7C", url: "https://www.cyhaoka.vip" }
        ];

        // 获取桌面元素
        const appGrid = document.getElementById('app-grid');

        // 生成应用图标
        apps.forEach(app => {
            const appCard = document.createElement('div');
            appCard.className = 'content-card';

            const appIcon = document.createElement('div');
            appIcon.className = 'app-icon';

            appCard.title = "点击跳转到新页面";

            // 创建图标 - 优先使用图片图标
            let icon;
            if (app.imageUrl) {
                // 使用图片图标
                icon = document.createElement('img');
                icon.src = app.imageUrl;
                icon.alt = app.name;
                
                // 图片加载完成后进行缩放处理
                icon.onload = function() {
                    // 获取图片原始尺寸
                    const naturalWidth = this.naturalWidth;
                    const naturalHeight = this.naturalHeight;
                    
                    // 计算缩放比例，以较长的边为基准
                    const maxSize = 60; // 图标固定大小
                    const scale = Math.max(naturalWidth, naturalHeight) / maxSize;
                    
                    // 设置缩放后的尺寸
                    this.style.width = `${naturalWidth / scale}px`;
                    this.style.height = `${naturalHeight / scale}px`;
                };
            } else {
                // 使用默认文字图标
                icon = document.createElement('div');
                icon.style.width = '60px';
                icon.style.height = '60px';
                icon.style.borderRadius = '14px';
                icon.style.backgroundColor = app.color;
                icon.style.display = 'flex';
                icon.style.alignItems = 'center';
                icon.style.justifyContent = 'center';
                icon.style.color = 'white';
                icon.style.fontSize = '24px';
                icon.style.fontWeight = 'bold';
                icon.textContent = app.name.charAt(0);
            }

            // 创建应用名称
            const appName = document.createElement('div');
            appName.className = 'app-name';
            appName.textContent = app.name;

            // 添加到应用图标
            appIcon.appendChild(icon);
            appIcon.appendChild(appName);

            // 添加到卡片
            appCard.appendChild(appIcon);

            // 添加点击事件
            appCard.addEventListener('click', () => {
                window.open(app.url, '_blank');
            });

            // 添加到桌面
            appGrid.appendChild(appCard);
        });
    </script>
</body>

</html>
