<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记录 · 动态时间线</title>
   <link rel="stylesheet" href="../../css/none.css">
    <link rel="stylesheet" href="../../css/color.css">
    <style>


        body {
            min-height: 100vh;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            transition: all 0.5s ease;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pageLoad 0.8s ease-out;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes slideInUp {
            from { transform: translateY(30px); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        @keyframes cardAppear {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to   { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes timelinePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-primary-rgb), 0.4); }
            50%      { box-shadow: 0 0 0 6px rgba(var(--accent-primary-rgb), 0.1); }
        }

        @keyframes pageLoad {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

       

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        /* 头部区域 */
        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--border-primary);
            animation: slideInUp 0.6s ease-out 0.2s both;
        }

        .page-title {
            color: var(--accent-primary);
            margin-bottom: 15px;
            font-size: 2.8rem;
            text-shadow: 0 0 15px var(--shadow-accent);
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* 时间线容器 — 动态填充，但样式核心不变 */
        .timeline {
            width: 100%;
            position: relative;
            padding: 20px 0;
        }

        /* 时间线中心线 */
        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--accent-primary), var(--accent-secondary));
            transform: translateX(-50%);
            border-radius: 2px;
            z-index: 1;
        }

        /* 记录卡片 — 基础布局由js动态添加类，但样式完全继承 */
        .record-card {
            width: calc(50% - 60px);
            margin-bottom: 40px;
            position: relative;
            animation: cardAppear 0.6s ease-out;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .record-card:nth-child(odd) {
            margin-left: auto;
        }

        .record-card:nth-child(even) {
            margin-right: auto;
        }

        /* 卡片内容 */
        .record-content {
            background-color: var(--secondary-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 8px 25px var(--shadow-primary);
            border: 2px solid var(--border-primary);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .record-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 16px 16px 0 0;
            transform: scaleX(0);
            transition: transform 0.5s ease;
        }

        .record-content:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px var(--shadow-primary);
            border-color: var(--accent-secondary);
        }

        .record-content:hover::before {
            transform: scaleX(1);
        }

        /* 时间点 */
        .record-timeline {
            position: absolute;
            top: 50%;
            width: 20px;
            height: 20px;
            background: var(--accent-primary);
            border-radius: 50%;
            z-index: 2;
            border: 4px solid var(--secondary-bg);
            transition: all 0.3s ease;
        }

        .record-card:nth-child(odd) .record-timeline {
            left: -70px;
            transform: translateY(-50%);
        }

        .record-card:nth-child(even) .record-timeline {
            right: -70px;
            transform: translateY(-50%);
        }

        .record-card:hover .record-timeline {
            background: var(--accent-secondary);
            transform: translateY(-50%) scale(1.2);
            animation: timelinePulse 2s infinite;
        }

        /* 卡片标题 */
        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-primary);
            text-shadow: 0 0 8px var(--shadow-accent);
            position: relative;
        }

        .card-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), transparent);
        }

        /* 卡片内容 */
        .card-body {
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 1.1rem;
        }

        .card-body p {
            margin-bottom: 10px;
        }

        .card-body p:last-child {
            margin-bottom: 0;
        }

        /* 响应式设计 —— 完全保留原版 */
        @media (max-width: 992px) {
            .timeline::before {
                left: 30px;
            }

            .record-card {
                width: calc(100% - 60px);
                margin-left: 60px !important;
                margin-right: 0 !important;
            }

            .record-card:nth-child(odd) .record-timeline,
            .record-card:nth-child(even) .record-timeline {
                left: -50px;
                right: auto;
            }
        }

        @media (max-width: 768px) {
            .container { padding: 15px; }
            header { margin-bottom: 30px; padding-bottom: 20px; }
            .page-title { font-size: 2.2rem; }
            .record-content { padding: 20px; }
            .card-title { font-size: 1.2rem; margin-bottom: 12px; padding-bottom: 12px; }
            .card-body { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .container { padding: 10px; }
            .page-title { font-size: 1.8rem; }
            .timeline::before { left: 15px; }
            .record-card {
                width: calc(100% - 30px);
                margin-left: 30px !important;
                margin-bottom: 30px;
            }
            .record-card:nth-child(odd) .record-timeline,
            .record-card:nth-child(even) .record-timeline {
                left: -35px;
                width: 16px;
                height: 16px;
            }
            .record-content { padding: 15px; border-radius: 12px; }
            .card-title { font-size: 1.1rem; margin-bottom: 10px; padding-bottom: 10px; }
            .card-body { font-size: 0.95rem; }
        }

        /* 空状态 —— 保留以备动态无数据时显示（本案例有数据不会触发） */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            animation: fadeIn 0.8s ease-out;
        }

        .empty-icon {
            font-size: 4rem;
            color: var(--accent-primary);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-message {
            font-size: 1.2rem;
            font-style: italic;
        }
    </style>
</head>
<body class="custom-scrollbar">
    <div class="container">
        <header>
            <h1 class="page-title">历史记录</h1>
        </header>

        <!-- 动态时间线会注入在此处 -->
        <div id="dynamic-timeline" class="timeline"></div>
    </div>

    <script src="../../json/公会历史数据.js"></script>
    <script>
        (function() {
            "use strict";

            function renderTimeline() {
                const timelineContainer = document.getElementById('dynamic-timeline');
                if (!timelineContainer) return;

                // 清空，准备重新注入（如果后续有动态更新需求）
                timelineContainer.innerHTML = '';

                // 如果没有记录，显示空状态（优雅降级）
                if (!RECORDS || RECORDS.length === 0) {
                    const emptyDiv = document.createElement('div');
                    emptyDiv.className = 'empty-state';
                    emptyDiv.innerHTML = `
                        <div class="empty-icon">📋</div>
                        <div class="empty-message">暂无记录，静待书写……</div>
                    `;
                    timelineContainer.appendChild(emptyDiv);
                    return;
                }

                // 循环创建每一条卡片 (DocumentFragment 优化性能)
                const fragment = document.createDocumentFragment();

                RECORDS.forEach((record, index) => {
                    // 创建卡片容器
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'record-card';
                    // 添加自定义属性或延迟动画单独设置（style设置在卡片上）
                    cardDiv.style.animationDelay = `${index * 0.2}s`;   // 与原script效果一致
                    
                    // ---- 结构：record-timeline 与 record-content ----
                    const timelineDot = document.createElement('div');
                    timelineDot.className = 'record-timeline';

                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'record-content';

                    // 标题
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'card-title';
                    titleDiv.textContent = record.title;

                    // 内容区域
                    const bodyDiv = document.createElement('div');
                    bodyDiv.className = 'card-body';
                    const para = document.createElement('p');
                    para.textContent = record.description;
                    bodyDiv.appendChild(para);

                    // 组合content
                    contentDiv.appendChild(titleDiv);
                    contentDiv.appendChild(bodyDiv);

                    // 组合卡片
                    cardDiv.appendChild(timelineDot);
                    cardDiv.appendChild(contentDiv);

                    // ----- 附加原版JS中的点击交互（在生成时绑定，但也可通过事件委托）-----
                    // 为了完全复刻原有体验，添加点击动画效果 (与原逻辑对齐)
                    cardDiv.addEventListener('click', function(e) {
                        // 不阻止冒泡，仅做视觉反馈
                        const content = this.querySelector('.record-content');
                        const timeline = this.querySelector('.record-timeline');
                        if (!content || !timeline) return;

                        // 获取当前的transform状态
                        content.style.transform = 'translateY(-5px) scale(1.02)';
                        content.style.boxShadow = '0 20px 40px var(--shadow-primary)';
                        
                        // 对timeline圆点做scale处理（注意保留已有的transform）
                        const currentTransform = timeline.style.transform;
                        if (currentTransform.includes('translateY(-50%)')) {
                            timeline.style.transform = 'translateY(-50%) scale(1.4)';
                        } else {
                            // 若其他情况，直接覆盖
                            timeline.style.transform = 'translateY(-50%) scale(1.4)';
                        }

                        // 300ms后还原
                        setTimeout(() => {
                            content.style.transform = '';
                            content.style.boxShadow = '';
                            timeline.style.transform = 'translateY(-50%)';  // 基础位置，hover会叠加scale(1.2)
                            // 注意：hover时会有scale(1.2)动画，此处重置后鼠标悬停依然有效
                        }, 300);
                    });

                    fragment.appendChild(cardDiv);
                });

                timelineContainer.appendChild(fragment);

                // ------- 初始化卡片可见性 (滚动动画 + 初始渐现) -------
                const cards = document.querySelectorAll('.record-card');
                
                // 初始设置透明并下移，用于后续滚动显现（同时也跟原版一样有一个延时浮现效果）
                cards.forEach(card => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                });

                // 延时逐渐显现卡片 (与原script行为一致：延迟300ms后每100ms显现一个)
                setTimeout(() => {
                    cards.forEach((card, idx) => {
                        setTimeout(() => {
                            card.style.opacity = '1';
                            card.style.transform = 'translateY(0)';
                        }, idx * 100);   // 100ms间隔
                    });
                }, 300);

                // 滚动动画监听 (原animateOnScroll功能)
                function animateOnScroll() {
                    const timelineEl = document.querySelector('.timeline');
                    if (!timelineEl) return;
                    
                    const timelineTop = timelineEl.getBoundingClientRect().top;
                    const timelineHeight = timelineEl.clientHeight;
                    
                    document.querySelectorAll('.record-card').forEach(card => {
                        const cardRect = card.getBoundingClientRect();
                        const cardTop = cardRect.top;
                        const cardHeight = cardRect.height;
                        
                        // 卡片出现在可视区域附近即显示完全透明
                        // 原逻辑使用cardPosition判断，简化：只要在可视区域内就设置为完全不透明
                        // 同时保留平滑感
                        if (cardTop < window.innerHeight - 50 && cardTop + cardHeight > 0) {
                            // 接近可见
                            card.style.opacity = '1';
                            card.style.transform = 'translateY(0)';
                        } else {
                            // 完全离开视口时，如果希望恢复半透明可自行调整，但通常保留可见
                            // 为了效果自然，离开视口时不强制改变，只是保留当前
                        }
                    });
                }

                // 绑定滚动事件 (使用节流优化)
                let ticking = false;
                window.addEventListener('scroll', function() {
                    if (!ticking) {
                        window.requestAnimationFrame(function() {
                            animateOnScroll();
                            ticking = false;
                        });
                        ticking = true;
                    }
                });
                // 立即执行一次
                animateOnScroll();
            }

            /**
             * ---------- 主题监听 (完全保留原功能) ----------
             */
            function listenToParentThemeChanges() {
                if (window.parent !== window) {
                    window.addEventListener('storage', function (e) {
                        if (e.key === 'preferred-theme') {
                            applyThemeFromParent(e.newValue);
                        }
                    });

                    const parentTheme = localStorage.getItem('preferred-theme') || 'default';
                    applyThemeFromParent(parentTheme);
                }
            }

            function applyThemeFromParent(theme) {
                if (theme === 'default') {
                    document.body.removeAttribute('data-theme');
                } else {
                    document.body.setAttribute('data-theme', theme);
                }

                document.body.style.transition = 'all 0.5s ease';
                setTimeout(() => {
                    document.body.style.transition = '';
                }, 500);
            }

            /**
             * ---------- 页面入口 ----------
             */
            document.addEventListener('DOMContentLoaded', function() {
                // 1. 渲染动态时间线（核心）
                renderTimeline();

                // 2. 主题监听
                listenToParentThemeChanges();

                // 3. 页面加载入场动画 (body透明度与位移)
                document.body.style.opacity = '0';
                document.body.style.transform = 'translateY(20px)';

                setTimeout(() => {
                    document.body.style.transition = 'all 0.6s ease';
                    document.body.style.opacity = '1';
                    document.body.style.transform = 'translateY(0)';
                    
                    setTimeout(() => {
                        document.body.style.transition = ''; // 恢复默认，防止后续干扰
                    }, 600);
                }, 100);

            });

        })();
    </script>
    <script src="../../js/security.js"></script>

</body>
</html>
