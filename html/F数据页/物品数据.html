<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物品数据</title>
    <link rel="stylesheet" href="../../css/none.css">
    <link rel="stylesheet" href="../../css/color.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        html, body {
            height: 100%;
            overflow: hidden; /* 禁止body滚动，所有滚动交给内部容器 */
        }

        body {
            min-height: 100vh;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.5s ease;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes cardAppear {
            from {
                transform: translateY(20px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes modalSlideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 0 5px var(--shadow-accent);
            }
            50% {
                box-shadow: 0 0 20px var(--shadow-accent);
            }
        }

        /* 主内容滚动容器 - 修复：只有这个区域可以滚动，页面主体固定 */
        .main-scroll-container {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            height: 100vh;
            padding: 20px;
        }

        /* 主容器 */
        .container {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 0.8s ease-out;
        }


        

       

        /* 搜索区域 */
        .search-container {
            background-color: var(--secondary-bg);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 40px;
            border: 2px solid var(--border-primary);
            box-shadow: 0 8px 25px var(--shadow-primary);
            animation: slideInUp 0.6s ease-out 0.3s both;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .search-icon {
            color: var(--accent-primary);
            font-size: 1.8rem;
            filter: drop-shadow(0 0 8px var(--shadow-accent));
        }

        .search-input {
            flex: 1;
            background-color: var(--primary-bg);
            border: 2px solid var(--border-primary);
            border-radius: 12px;
            padding: 16px 25px;
            color: var(--text-primary);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(var(--accent-primary-rgb), 0.2);
            transform: translateY(-2px);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-stats {
            color: var(--text-secondary);
            font-size: 1rem;
            text-align: center;
        }

        .search-stats span {
            color: var(--accent-primary);
            font-weight: 700;
        }

        /* 物品网格 */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        /* 物品卡片 */
        .item-card {
            background-color: var(--secondary-bg);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px var(--shadow-primary);
            border: 2px solid var(--border-primary);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            animation: cardAppear 0.6s ease-out;
            position: relative;
        }

        .item-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transform: scaleX(0);
            transition: transform 0.5s ease;
            z-index: 2;
        }

        .item-card:hover {
            transform: translateY(-12px) scale(1.03);
            box-shadow: 0 20px 50px var(--shadow-primary);
            border-color: var(--accent-secondary);
        }

        .item-card:hover::before {
            transform: scaleX(1);
        }

        .item-card:hover .item-image {
            transform: scale(1.1);
        }

        /* 图片容器 */
        .image-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: var(--tertiary-bg);
            position: relative;
        }

        .item-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 物品信息 */
        .item-info {
            padding: 25px;
        }

        .item-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 0 10px var(--shadow-accent);
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .price-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .price-item {
            text-align: center;
        }

        .price-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .price-value {
            font-weight: 800;
            color: var(--text-primary);
            font-size: 1.2rem;
        }

        .last-updated {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            padding-top: 15px;
            border-top: 1px solid var(--border-primary);
        }

        /* 无结果提示 */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .no-results-icon {
            font-size: 4rem;
            color: var(--accent-primary);
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-results-message {
            color: var(--text-secondary);
            font-size: 1.3rem;
            font-style: italic;
        }

        /* 详情面板 - 修复：固定定位，不随滚动条滚动 */
        .detail-panel {
            position: fixed;
            top: 0;
            right: -100%;
            width: 45%;
            min-width: 500px;
            height: 100vh;
            background-color: var(--secondary-bg);
            border-left: 4px solid var(--accent-primary);
            box-shadow: -15px 0 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            z-index: 2000; /* 提高层级 */
            transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .detail-panel.active {
            right: 0;
            animation: modalSlideIn 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 详情内容 - 内部滚动 */
        .detail-content-wrapper {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 30px;
            padding-right: 25px;
        }

        .detail-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-primary);
        }

        .detail-name {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-primary);
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--shadow-accent);
        }

        .detail-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            border: 2px solid var(--border-primary);
        }

        /* 详情区域 */
        .detail-section {
            margin-bottom: 35px;
            padding: 25px;
            background-color: var(--primary-bg);
            border-radius: 15px;
            border: 1px solid var(--border-primary);
            transition: all 0.3s ease;
        }

        .detail-section:hover {
            border-color: var(--accent-primary);
            transform: translateX(5px);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-secondary);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent-secondary-transparent);
        }

        /* 价格统计网格 */
        .price-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .price-stat {
            /* background: linear-gradient(135deg, var(--tertiary-bg), var(--border-primary)); */
            border: 1px solid var(--border-primary);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .price-stat:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow-primary);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            color: var(--text-primary);
            font-size: 1.6rem;
            font-weight: 800;
        }

        .price-change {
            color: var(--accent-secondary);
            font-weight: 600;
        }

        /* 价格图表 */
        .price-chart-container {
            padding: 20px;
            background-color: var(--tertiary-bg);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .price-chart {
            width: 100%;
            height: 200px;
            position: relative;
        }

        .chart-line {
            fill: none;
            stroke: var(--accent-primary);
            stroke-width: 3;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(var(--accent-primary-rgb), 0.5));
        }

        .chart-point {
            fill: var(--accent-secondary);
            r: 5;
            transition: r 0.3s ease;
        }

        .chart-point:hover {
            r: 8;
            fill: var(--accent-primary);
        }

        .chart-axis {
            stroke: var(--border-primary);
            stroke-width: 1;
        }

        .chart-label {
            fill: var(--text-secondary);
            font-size: 0.8rem;
        }

        /* 来源列表 */
        .source-list {
            list-style-type: none;
            padding: 0;
        }

        .source-list li {
            padding: 15px;
            border-bottom: 1px solid var(--border-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
        }

        .source-list li:hover {
            background-color: var(--accent-primary-transparent);
            transform: translateX(5px);
        }

        .source-list li:last-child {
            border-bottom: none;
        }

        .source-list li i {
            color: var(--accent-primary);
            margin-right: 15px;
            font-size: 1.2rem;
            filter: drop-shadow(0 0 5px var(--shadow-accent));
        }

        /* 关闭按钮 - 修复：固定定位，与详情面板一起 */
        .close-detail {
            position: fixed;
            top: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background: var(--accent-primary);
            color: var(--text-light);
            border: none;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2001; /* 高于详情面板 */
            box-shadow: 0 6px 25px var(--shadow-primary);
        }

        .detail-panel.active + .close-detail {
            display: flex;
            right: calc(45% + 30px);
        }

        .close-detail:hover {
            background: var(--accent-secondary);
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 10px 30px var(--shadow-primary);
        }

        /* 当详情面板打开时，禁止主内容滚动 */
        body.detail-open .main-scroll-container {
            overflow: hidden;
        }

        /* 页脚 */
        .footer {
            margin-top: 50px;
            text-align: center;
            padding-top: 25px;
            border-top: 2px solid var(--border-primary);
            color: var(--text-secondary);
            font-size: 0.95rem;
            animation: fadeIn 0.8s ease-out;
        }

        /* 响应式设计 */
        @media (max-width: 1400px) {
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 25px;
            }
            
            .detail-panel {
                width: 50%;
                min-width: 450px;
            }
            
            .detail-panel.active + .close-detail {
                right: calc(50% + 30px);
            }
        }

        @media (max-width: 1200px) {
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 20px;
            }
            
            .detail-panel {
                width: 60%;
                min-width: 400px;
            }
            
            .detail-panel.active + .close-detail {
                right: calc(60% + 30px);
            }
            
            .price-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 992px) {
            .container {
                padding: 15px;
            }
          
            .detail-panel {
                width: 70%;
                min-width: 350px;
            }
            
            .detail-panel.active + .close-detail {
                right: calc(70% + 20px);
            }
        }

        @media (max-width: 768px) {
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
            
            .item-info {
                padding: 15px;
            }
            
            .item-name {
                font-size: 1.2rem;
                min-height: 50px;
            }
            
            .price-container {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .detail-panel {
                width: 85%;
                min-width: 0;
            }
            
            .detail-panel.active + .close-detail {
                right: 20px;
                top: 20px;
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .detail-content-wrapper {
                padding: 20px;
            }
            
            .detail-name {
                font-size: 1.8rem;
            }
            
            .detail-image {
                height: 200px;
            }
            
            .price-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        @media (max-width: 576px) {
            .main-scroll-container {
                padding: 10px;
            }
            
            .container {
                padding: 10px;
            }
            
           
            
           
            
            .search-container {
                padding: 15px;
            }
            
            .search-input {
                padding: 12px 20px;
                font-size: 1rem;
            }
            
            .items-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .detail-panel {
                width: 95%;
            }
            
            .detail-panel.active + .close-detail {
                right: 15px;
                top: 15px;
            }
        }

        @media (max-width: 480px) {
            .detail-panel {
                width: 100%;
                border-left: none;
                border-top: 4px solid var(--accent-primary);
                right: 0;
                top: 100%;
                height: calc(100vh - 80px);
                min-width: 0;
                transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            }
            
            .detail-panel.active {
                top: 0;
                right: 0;
            }
            
            .detail-panel.active + .close-detail {
                right: 15px;
                top: 15px;
            }
        }

        /* 横屏优化 */
        @media (max-height: 600px) and (orientation: landscape) {
            .items-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 15px;
            }
            
            .image-container {
                height: 150px;
            }
            
            .detail-panel {
                width: 70%;
            }
            
            .detail-panel.active + .close-detail {
                right: calc(70% + 15px);
            }
        }

        /* 页面加载动画 */
        @keyframes pageLoad {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            animation: pageLoad 0.8s ease-out;
        }
    </style>
</head>
<body>
    <!-- 主内容滚动容器 - 只有这个区域可以滚动 -->
    <div class="main-scroll-container custom-scrollbar" id="mainScrollContainer">
        <div class="container">

            <!-- 搜索区域 -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="search-input" id="searchInput" placeholder="输入物品名称进行搜索...">
                </div>
                <div class="search-stats">
                    找到 <span id="itemCount">0</span> 个物品 (共 <span id="totalCount">0</span> 个)
                </div>
            </div>

            <!-- 物品网格 -->
            <div class="items-grid" id="itemsContainer">
                <!-- 物品卡片将通过JavaScript动态生成 -->
            </div>

            <!-- 页脚 -->
            <div class="footer">
                <p>所有数据具有时效性，仅供参考。</p>
            </div>
        </div>
    </div>

    <!-- 详情面板 - 固定定位，独立于滚动容器 -->
    <div class="detail-panel" id="detailPanel">
        <div class="detail-content-wrapper custom-scrollbar" id="detailContentWrapper">
            <div id="detailContent">
                <!-- 详情内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>
    
    <!-- 关闭按钮 - 固定定位 -->
    <button class="close-detail" id="closeDetail" title="关闭详情">
        <i class="fas fa-times"></i>
    </button>

    <script src="../../json/物品数据.js"></script>
    <script>
        /**
         * 监听父窗口的主题变化
         */
        function listenToParentThemeChanges() {
            if (window.parent !== window) {
                window.addEventListener('storage', function (e) {
                    if (e.key === 'preferred-theme') {
                        applyThemeFromParent(e.newValue);
                    }
                });

                const parentTheme = localStorage.getItem('preferred-theme') || 'default';
                applyThemeFromParent(parentTheme);
            }
        }

        /**
         * 应用父窗口的主题
         */
        function applyThemeFromParent(theme) {
            if (theme === 'default') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', theme);
            }

            document.body.style.transition = 'all 0.5s ease';
            setTimeout(() => {
                document.body.style.transition = '';
            }, 500);
        }

        

        // DOM元素
        const mainScrollContainer = document.getElementById('mainScrollContainer');
        const itemsContainer = document.getElementById('itemsContainer');
        const searchInput = document.getElementById('searchInput');
        const itemCount = document.getElementById('itemCount');
        const totalCount = document.getElementById('totalCount');
        const detailPanel = document.getElementById('detailPanel');
        const detailContent = document.getElementById('detailContent');
        const closeDetailBtn = document.getElementById('closeDetail');
        const detailContentWrapper = document.getElementById('detailContentWrapper');
        const body = document.body;

        // 页面加载初始化
        document.addEventListener('DOMContentLoaded', function() {
            listenToParentThemeChanges();
            
            // 显示物品总数
            totalCount.textContent = gameItems.length;
            itemCount.textContent = gameItems.length;
            
            // 渲染所有物品卡片
            renderItems(gameItems);
            
            // 搜索功能
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase().trim();
                let filteredItems;
                
                if (searchTerm === '') {
                    filteredItems = gameItems;
                } else {
                    filteredItems = gameItems.filter(item => 
                        item.name.toLowerCase().includes(searchTerm)
                    );
                }
                
                renderItems(filteredItems);
                itemCount.textContent = filteredItems.length;
            });
            
            // 关闭详情面板
            closeDetailBtn.addEventListener('click', function() {
                closeDetailPanel();
            });
            
            // ESC键关闭详情面板
            document.addEventListener('keydown', function(event) {
                if (event.key === 'Escape' && detailPanel.classList.contains('active')) {
                    closeDetailPanel();
                }
            });
            
            function closeDetailPanel() {
                detailPanel.classList.remove('active');
                body.classList.remove('detail-open'); // 恢复主内容滚动
            }
            
            // 渲染物品卡片函数
            function renderItems(items) {
                itemsContainer.innerHTML = '';
                
                if (items.length === 0) {
                    itemsContainer.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-search no-results-icon"></i>
                            <p class="no-results-message">没有找到匹配的物品，请尝试其他搜索关键词</p>
                        </div>
                    `;
                    return;
                }
                
                items.forEach((item, index) => {
                    // 计算价格统计数据
                    const minPrice = Math.min(...item.prices);
                    const avgPrice = Math.round(item.prices.reduce((a, b) => a + b, 0) / item.prices.length);
                    
                    const itemCard = document.createElement('div');
                    itemCard.className = 'item-card';
                    itemCard.dataset.id = item.id;
                    itemCard.style.animationDelay = `${index * 0.1}s`;
                    
                    itemCard.innerHTML = `
                        <div class="image-container">
                            <img src="${item.image}" alt="${item.name}" class="item-image">
                        </div>
                        <div class="item-info">
                            <h3 class="item-name">${item.name}</h3>
                            <div class="price-container">
                                <div class="price-item">
                                    <div class="price-label">最低价</div>
                                    <div class="price-value">${minPrice.toLocaleString()} 原</div>
                                </div>
                                <div class="price-item">
                                    <div class="price-label">平均价</div>
                                    <div class="price-value">${avgPrice.toLocaleString()} 原</div>
                                </div>
                            </div>
                            <div class="last-updated">${item.lastUpdated}</div>
                        </div>
                    `;
                    
                    // 点击卡片显示详情面板
                    itemCard.addEventListener('click', function() {
                        showItemDetail(item);
                    });
                    
                    itemsContainer.appendChild(itemCard);
                });
            }
            
            // 显示物品详情
            function showItemDetail(item) {
                // 计算统计数据
                const minPrice = Math.min(...item.prices);
                const maxPrice = Math.max(...item.prices);
                const avgPrice = Math.round(item.prices.reduce((a, b) => a + b, 0) / item.prices.length);
                const currentPrice = item.prices[item.prices.length - 1];
                const priceChange = item.prices.length > 1 ? currentPrice - item.prices[item.prices.length - 2] : 0;
                
                // 生成价格走势图
                const chartHTML = generatePriceChart(item.prices);
                
                // 生成来源列表
                const sourcesHTML = item.sources.map(source => 
                    `<li><i class="fas fa-map-marker-alt"></i>${source}</li>`
                ).join('');
                
                // 填充详情内容
                detailContent.innerHTML = `
                    <div class="detail-header">
                        <h1 class="detail-name">${item.name}</h1>
                    </div>
                    
                    <img src="${item.image}" alt="${item.name}" class="detail-image">
                    
                    <div class="detail-section">
                        <h2 class="section-title">物品描述</h2>
                        <p>${item.description}</p>
                    </div>
                    
                    <div class="detail-section">
                        <h2 class="section-title">价格统计</h2>
                        <div class="price-grid">
                            <div class="price-stat">
                                <div class="stat-label">当前价格</div>
                                <div class="stat-value">${currentPrice.toLocaleString()}</div>
                            </div>
                            <div class="price-stat">
                                <div class="stat-label">最低价格</div>
                                <div class="stat-value">${minPrice.toLocaleString()}</div>
                            </div>
                            <div class="price-stat">
                                <div class="stat-label">最高价格</div>
                                <div class="stat-value">${maxPrice.toLocaleString()}</div>
                            </div>
                            <div class="price-stat">
                                <div class="stat-label">平均价格</div>
                                <div class="stat-value">${avgPrice.toLocaleString()}</div>
                            </div>
                            <div class="price-stat">
                                <div class="stat-label">价格变化</div>
                                <div class="stat-value price-change">
                                    ${priceChange >= 0 ? '+' : ''}${priceChange.toLocaleString()}
                                </div>
                            </div>
                            <div class="price-stat">
                                <div class="stat-label">最后更新</div>
                                <div class="stat-value">${item.lastUpdated}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <h2 class="section-title">价格变化 (近7次)</h2>
                        <div class="price-chart-container">
                            ${chartHTML}
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <h2 class="section-title">产出方式</h2>
                        <ul class="source-list">
                            ${sourcesHTML}
                        </ul>
                    </div>
                `;
                
                // 显示详情面板
                detailPanel.classList.add('active');
                body.classList.add('detail-open'); // 禁止主内容滚动
                
                // 滚动到顶部
                detailContentWrapper.scrollTop = 0;
            }
            
            // 生成价格走势图
            function generatePriceChart(prices) {
                const width = 400;
                const height = 200;
                const padding = 50;
                const rightPadding = 30;
                
                // 计算坐标
                const maxPrice = Math.max(...prices);
                const minPrice = Math.min(...prices);
                const priceRange = maxPrice - minPrice || 1; // 防止除以0
                
                const chartWidth = width - padding - rightPadding;
                const xStep = chartWidth / (prices.length - 1);
                const yScale = (height - padding * 2) / priceRange;
                
                // 生成折线路径
                let pathData = `M ${padding} ${height - padding - (prices[0] - minPrice) * yScale}`;
                
                for (let i = 1; i < prices.length; i++) {
                    const x = padding + i * xStep;
                    const y = height - padding - (prices[i] - minPrice) * yScale;
                    pathData += ` L ${x} ${y}`;
                }
                
                // 生成点
                const points = prices.map((price, i) => {
                    const x = padding + i * xStep;
                    const y = height - padding - (price - minPrice) * yScale;
                    return `<circle class="chart-point" cx="${x}" cy="${y}" data-price="${price}" />`;
                }).join('');
                
                // 生成坐标轴
                const axis = `
                    <line class="chart-axis" x1="${padding}" y1="${height - padding}" x2="${width - rightPadding}" y2="${height - padding}" />
                    <line class="chart-axis" x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" />
                `;
                
                // 生成标签
                const labels = prices.map((_, i) => {
                    const x = padding + i * xStep;
                    const label = i === 0 ? '7次前' : i === prices.length - 1 ? '最新' : '';
                    return label ? `<text class="chart-label" x="${x}" y="${height - padding + 15}" text-anchor="middle">${label}</text>` : '';
                }).join('');
                
                // 价格标签
                const priceLabels = `
                    <text class="chart-label" x="${padding - 5}" y="${height - padding + 3}" text-anchor="end" font-size="0.7rem">${minPrice}</text>
                    <text class="chart-label" x="${padding - 5}" y="${padding + 10}" text-anchor="end" font-size="0.7rem">${maxPrice}</text>
                    <text class="chart-label" x="${padding - 5}" y="${height/2}" text-anchor="end" font-size="0.7rem">${Math.round((maxPrice + minPrice) / 2)}</text>
                `;
                
                return `
                    <svg class="price-chart" viewBox="0 0 ${width} ${height}">
                        ${axis}
                        <path class="chart-line" d="${pathData}" />
                        ${points}
                        ${labels}
                        ${priceLabels}
                    </svg>
                `;
            }
            
            // 添加页面加载动画
            mainScrollContainer.style.opacity = '0';
            mainScrollContainer.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                mainScrollContainer.style.transition = 'all 0.6s ease';
                mainScrollContainer.style.opacity = '1';
                mainScrollContainer.style.transform = 'translateY(0)';
                
                setTimeout(() => {
                    mainScrollContainer.style.transition = '';
                }, 600);
            }, 100);
        });
    </script>
    <script src="../../js/security.js"></script>
</html>
