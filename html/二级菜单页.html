<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用网格</title>
     <link rel="stylesheet" href="../css/none.css">
    <link rel="stylesheet" href="../css/color.css">
    <style>

        body {
            min-height: 100vh;
            background-color: var(--primary-bg);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            transition: all 0.5s ease;
        }

        /* 动画定义 */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes cardAppear {
            from {
                transform: translateY(20px) scale(0.9);
                opacity: 0;
            }

            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(var(--accent-primary-rgb), 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(var(--accent-primary-rgb), 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(var(--accent-primary-rgb), 0);
            }
        }

        /* 平板容器 - 保持现有设计但使用主题色 */
        .tablet-container {
            width: 100vw;
            height: 100vh;
            background-color: var(--secondary-bg);
            
            box-shadow: 0 20px 50px var(--shadow-dark);
            overflow: hidden;
            position: relative;
            /* border: 12px solid var(--tertiary-bg); */
            animation: fadeIn 0.8s ease-out;
            transition: all 0.3s ease;
        }

        /* 平板边框发光效果 */
        .tablet-container::before {
            content: '';
            position: absolute;
            top: -12px;
            left: -12px;
            right: -12px;
            bottom: -12px;
            border-radius: 36px;
            background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary));
            z-index: -1;
            opacity: 0.3;
            filter: blur(10px);
            transition: all 0.5s ease;
        }

        /* 主内容区域 */
        .main-content {
            height: 100%;
            padding: 30px;
            overflow-y: auto;
            background-color: var(--primary-bg);
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        /* 应用网格布局 */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        /* 应用卡片 - 根据打开类型设置不同背景 */
        .app-card {
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 12px var(--shadow-primary);
            border: 1px solid var(--border-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            height: 140px;
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.5s ease-out var(--card-delay, 0.3s) both;
            background-color: var(--secondary-bg);
        }

        /* 卡片逐个出现延迟 */
        .app-card:nth-child(1) {
            --card-delay: 0.1s;
        }

        .app-card:nth-child(2) {
            --card-delay: 0.2s;
        }

        .app-card:nth-child(3) {
            --card-delay: 0.3s;
        }

        .app-card:nth-child(4) {
            --card-delay: 0.4s;
        }

        .app-card:nth-child(5) {
            --card-delay: 0.5s;
        }

        .app-card:nth-child(6) {
            --card-delay: 0.6s;
        }

        .app-card:nth-child(7) {
            --card-delay: 0.7s;
        }

        .app-card:nth-child(8) {
            --card-delay: 0.8s;
        }

        /* 当前页打开的卡片样式 - 使用更深背景色 */
        .app-card.same-tab {
            background-color: var(--tertiary-bg);
            position: relative;
        }

        /* 当前页打开卡片的高亮边框 */
        .app-card.same-tab::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 12px;
            border: 2px solid transparent;
            background: linear-gradient(45deg, var(--accent-primary), var(--accent-secondary)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            pointer-events: none;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--accent-primary-transparent), transparent);
            transition: left 0.6s;
        }

        .app-card:hover::before {
            left: 100%;
        }

        .app-card:hover {
            border-color: var(--accent-secondary);
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow-primary);
        }

        .app-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* 跳转提示标签 */
        .jump-tag {
            position: absolute;
            top: 8px;
            right: 8px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--text-light);
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            z-index: 2;
            opacity: 0.9;
            animation: pulse 2s infinite;
            box-shadow: 0 2px 4px var(--shadow-primary);
        }

        /* 应用图标容器 */
        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            border-radius: 16px;
            padding: 10px;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }

        .app-card:hover .app-icon {
            transform: scale(1.05);
        }

        /* 图标样式 */
        .app-icon-image {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            margin-bottom: 10px;
            box-shadow: 0 4px 8px var(--shadow-primary);
            object-fit: cover;
            border: 2px solid var(--border-primary);
            transition: all 0.3s ease;
        }

        .app-card:hover .app-icon-image {
            border-color: var(--accent-secondary);
            box-shadow: 0 0 15px var(--shadow-accent);
        }

        .app-icon-fallback {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            border: 2px solid var(--border-primary);
            transition: all 0.3s ease;
        }

        .app-card:hover .app-icon-fallback {
            border-color: var(--accent-secondary);
            box-shadow: 0 0 15px var(--shadow-accent);
        }

        /* 应用名称 */
        .app-name {
            font-size: 13px;
            color: var(--text-primary);
            text-align: center;
            font-weight: 500;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            transition: color 0.3s ease;
        }

        .app-card:hover .app-name {
            color: var(--accent-primary);
            font-weight: 600;
        }

        /* 响应式设计 */
        @media (max-width: 968px) {
            .tablet-container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }

            .tablet-container::before {
                display: none;
            }

            .main-content {
                padding: 20px;
            }

            .app-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 15px;
            }

            .app-card {
                height: 130px;
            }

            .app-icon-image,
            .app-icon-fallback {
                width: 55px;
                height: 55px;
            }
        }

        @media (max-width: 768px) {
            .app-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 480px) {
            .tablet-container {
                height: 100vh;
            }

            .main-content {
                padding: 15px;
            }

            .app-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .app-card {
                height: 120px;
                padding: 8px;
            }

            .app-icon-image,
            .app-icon-fallback {
                width: 50px;
                height: 50px;
                margin-bottom: 6px;
            }

            .app-name {
                font-size: 12px;
            }

            .jump-tag {
                font-size: 0.55rem;
                padding: 1px 4px;
                top: 5px;
                right: 5px;
            }
        }

        /* 横屏优化 */
        @media (max-height: 600px) and (orientation: landscape) {
            .app-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 15px;
            }

            .app-card {
                height: 120px;
            }
        }
    </style>
</head>

<body>
    <div class="tablet-container">
        <div class="main-content custom-scrollbar">
            <div class="app-grid" id="appGrid"></div>
        </div>
    </div>


    <script src="../json/二级菜单页应用数据.js"></script>
    <script>

        // 获取URL参数中的配置标识
        function getConfigFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('config') || 'home';
        }

        /**
         * 监听父窗口的主题变化
         */
        function listenToParentThemeChanges() {
            // 检查是否在iframe中
            if (window.parent !== window) {
                // 监听存储变化（父窗口主题变化会更新localStorage）
                window.addEventListener('storage', function (e) {
                    if (e.key === 'preferred-theme') {
                        applyThemeFromParent(e.newValue);
                    }
                });

                // 初始应用父窗口主题
                const parentTheme = localStorage.getItem('preferred-theme') || 'default';
                applyThemeFromParent(parentTheme);
            }
        }

        /**
         * 应用父窗口的主题
         * @param {string} theme - 主题名称
         */
        function applyThemeFromParent(theme) {
            if (theme === 'default') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', theme);
            }

            // 添加主题切换动画
            document.body.style.transition = 'all 0.5s ease';
            setTimeout(() => {
                document.body.style.transition = '';
            }, 500);
        }

        /**
         * 创建应用图标元素
         * @param {Object} app - 应用对象
         * @returns {HTMLElement} - 图标元素
         */
        function createAppIcon(app) {
            let icon;

            if (app.imageUrl) {
                icon = document.createElement('img');
                icon.className = 'app-icon-image';
                icon.src = app.imageUrl;
                icon.alt = app.name;

                icon.onload = function () {
                    const naturalWidth = this.naturalWidth;
                    const naturalHeight = this.naturalHeight;
                    const maxSize = 60;
                    const scale = Math.max(naturalWidth, naturalHeight) / maxSize;

                    this.style.width = `${naturalWidth / scale}px`;
                    this.style.height = `${naturalHeight / scale}px`;
                };
            } else {
                icon = document.createElement('div');
                icon.className = 'app-icon-fallback';
                icon.style.backgroundColor = app.color;
                icon.textContent = app.name.charAt(0);
            }

            return icon;
        }

        /**
         * 创建跳转标签
         * @returns {HTMLElement} - 跳转标签元素
         */
        function createJumpTag() {
            const tag = document.createElement('div');
            tag.className = 'jump-tag';
            tag.textContent = '跳转';
            return tag;
        }

        /**
         * 创建应用卡片
         * @param {Object} app - 应用对象
         * @returns {HTMLElement} - 卡片元素
         */
        function createAppCard(app) {
            const card = document.createElement('div');

            const openTypeClass = app.openType === "newTab" ? "new-tab" : "same-tab";
            card.className = `app-card ${openTypeClass}`;

            const hintText = app.openType === "newTab" ? ">跳转<" : ">打开<";
            card.title = `${app.name}\n${hintText}`;

            const iconContainer = document.createElement('div');
            iconContainer.className = 'app-icon';

            const icon = createAppIcon(app);
            iconContainer.appendChild(icon);

            const nameElement = document.createElement('div');
            nameElement.className = 'app-name';
            nameElement.textContent = app.name;
            iconContainer.appendChild(nameElement);

            card.appendChild(iconContainer);

            // 为新窗口打开的卡片添加跳转标签
            if (app.openType === "newTab") {
                const jumpTag = createJumpTag();
                card.appendChild(jumpTag);
            }

            card.addEventListener('click', (e) => {
                // 添加点击动画
                card.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    card.style.transform = '';
                }, 150);

                if (app.openType === "newTab") {
                    window.open(app.url, '_blank');
                } else {
                    window.location.href = app.url;
                }
            });

            return card;
        }

        /**
         * 初始化应用网格
         */
        function initializeAppGrid() {
            const configKey = getConfigFromURL();
            const config = appConfigs[configKey] || appConfigs.home;

            // 设置页面标题
            document.title = config.title;

            // 清空现有网格
            appGrid.innerHTML = '';

            // 创建新的应用卡片
            config.apps.forEach(app => {
                if (!app.openType) {
                    app.openType = "newTab";
                }

                const appCard = createAppCard(app);
                appGrid.appendChild(appCard);
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            initializeAppGrid();

            // 监听父窗口主题变化
            listenToParentThemeChanges();

            // 添加页面加载动画
            document.body.style.opacity = '0';
            document.body.style.transform = 'translateY(10px)';
            document.body.style.transition = 'all 0.5s ease';

            setTimeout(() => {
                document.body.style.opacity = '1';
                document.body.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
    <script src="../js/security.js"></script>
</body>

</html>
