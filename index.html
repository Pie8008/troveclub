<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promiscuous Eden</title>
    <!-- Font Awesome图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./公共页/none.css">
    <link rel="stylesheet" href="./index.css">
    <style></style>
</head>

<body>
    <!-- 移动端遮罩层 -->
    <div class="mobile-overlay" id="mobile-overlay"></div>

    <!-- ===== 左侧导航栏 ===== -->
    <div class="sidebar" id="sidebar">
        <!-- Logo区域 -->
        <div class="logo">
            <img src="./图片/杂项图标/公会图标.png" alt="Promiscuous Eden" width="200px" height="200px">
            <h1>堕乐园</h1>
            <p></p>
            <p>&copy; 2023-
                <script>document.write(new Date().getFullYear())</script><br>PROMISCUOUS&nbsp;EDEN
            </p>
        </div>

        <!-- 主要导航分组 -->
        <div class="nav-section">
            <div class="nav-buttons">

                <div class="nav-button active" data-page="A">
                    <i class="fa-solid fa-house"></i>
                    <span>主页</span>
                </div>

                <div class="nav-button" data-page="B" data-config="tools">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>工具箱</span>
                    <span class="badge">5</span>
                </div>

                <div class="nav-button" data-page="C" data-config="guides">
                    <i class="fas fa-fist-raised"></i>
                    <span>快捷攻略</span>
                    <span class="badge">3</span>
                </div>

                <div class="nav-button" data-page="D" data-config="more">
                    <i class="fas fa-fist-raised"></i>
                    <span>更多</span>
                    <span class="badge">6</span>
                </div>

                <div class="nav-button" data-page="E" data-config="records">
                    <i class="fa-solid fa-pen"></i>
                    <span>公会记录</span>
                    <span class="badge">2</span>
                </div>

                <div class="nav-button" data-page="F">
                    <i class="fa-solid fa-gamepad"></i>
                    <span>物品数据库</span>
                    <!-- <span class="badge">1</span> -->
                </div>

                <div class="nav-button" data-page="G" data-config="games">
                    <i class="fa-solid fa-gamepad"></i>
                    <span>网页小游戏</span>
                    <span class="badge">1</span>
                </div>

            </div>
        </div>

    </div>

    <!-- ===== 右侧内容区域 ===== -->
    <div class="content">
        <!-- 变动标题区域 -->
        <div class="top-bar">
            <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
            <h2>主页</h2>

            <!-- 会长区域 -->
            <div class="user-info" id="user-info">
                <img src="./图片/杂项图标/user.png" alt="头像">
                <div class="user-details">
                    <div class="user-name">Yu_qi</div>
                    <div class="user-rank">会长</div>
                </div>
            </div>
        </div>

        <!-- iframe容器 -->
        <div class="iframe-container">
            <iframe id="content-frame" src="./公共页/加载.html" title="内容区域"></iframe>
        </div>
    </div>

    <!-- 添加音频元素 -->
    <audio id="click-audio" preload="auto">
        <source src="./音频/橡皮鸭叫.mp3" type="audio/mpeg">

    </audio>

    <script src="./index.js"></script>
</body>

</html>
