<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>堕乐园</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f6f7f9;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
      color: #222;
      line-height: 1.6;
      padding: 24px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .wiki-container {
      max-width: 1060px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06), 0 1px 4px rgba(0, 0, 0, 0.04);
      padding: 28px 32px 40px;
      transition: all 0.2s;
    }

    .wiki-header {
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 1px solid #e8ecf0;
      padding-bottom: 16px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .wiki-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      overflow: hidden;
    }

    .wiki-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .wiki-title-group {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .guild-title-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: none;
      padding: 0;
      cursor: pointer;
      text-decoration: none;
      color: #1a1f2b;
      transition: 0.2s;
      border-radius: 8px;
      padding: 4px 8px 4px 4px;
      margin-left: -8px;
    }

    .guild-title-link:hover {
      background: #eef4ff;
      color: #1f2a3a;
    }

    .guild-title-link h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 1px;
      color: inherit;
      margin: 0;
    }

    .guild-title-link i {
      color: #4b7bec;
      font-size: 20px;
      opacity: 0.7;
      transition: 0.2s;
    }

    .guild-title-link:hover i {
      opacity: 1;
      transform: translateX(3px);
    }

    .wiki-title-group .sub {
      font-size: 14px;
      color: #7e8a98;
      margin-top: 2px;
      letter-spacing: 0.3px;
    }

    .wiki-title-group .sub i {
      margin-right: 6px;
      color: #9aa6b5;
    }

    .guild-info {
      background: #f8faff;
      border-left: 4px solid #4b7bec;
      padding: 14px 22px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 28px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 18px 32px;
      font-size: 15px;
      color: #2c3e50;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
    }

    .guild-info-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .guild-info-item i {
      color: #4b7bec;
      width: 20px;
      font-size: 16px;
    }

    .guild-info-item strong {
      font-weight: 600;
      color: #1f2a3a;
    }

    .guild-info-item span {
      color: #3d4d5e;
    }

    .hall-of-fame-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f2f6fe;
      border: 1px solid #e3eaf5;
      border-radius: 10px;
      padding: 12px 24px;
      margin-bottom: 34px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #1f2a3a;
      min-height: 60px;
      flex-wrap: wrap;
      gap: 10px 16px;
    }

    .hall-of-fame-link:hover {
      background: #e8efff;
      border-color: #b8cbe5;
      box-shadow: 0 4px 12px rgba(75, 123, 236, 0.10);
      transform: translateY(-1px);
    }

    .hall-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .hall-left i {
      color: #f1c40f;
      font-size: 26px;
    }

    .hall-left .hall-label {
      font-weight: 600;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .hall-preview {
      display: flex;
      align-items: center;
      gap: 8px 18px;
      flex-wrap: wrap;
      color: #3d4d5e;
    }

    .hall-preview .member-tag {
      background: white;
      padding: 2px 14px 2px 10px;
      border-radius: 30px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #dce3ed;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
    }

    .hall-preview .member-tag i {
      color: #f39c12;
      font-size: 13px;
    }

    .hall-arrow {
      color: #4b7bec;
      font-size: 18px;
      margin-left: auto;
      opacity: 0.6;
      transition: 0.2s;
    }

    .hall-of-fame-link:hover .hall-arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    .category-section {
      margin-top: 8px;
    }

    .category-block {
      margin-bottom: 30px;
    }

    .category-title {
      font-size: 18px;
      font-weight: 600;
      color: #1f2a3a;
      border-bottom: 2px solid #e8ecf0;
      padding-bottom: 8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-title i {
      color: #4b7bec;
      font-size: 20px;
      width: 28px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px 16px;
    }

    .entry-item {
      background: #fafbfc;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
      border: 1px solid #edf0f5;
      color: #1f2a3a;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .entry-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 4px;
      overflow: hidden;
      background: #eef1f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .entry-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .entry-item .entry-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry-item .badge {
      margin-left: auto;
      background: #e0e7f0;
      color: #2c3e50;
      font-size: 11px;
      font-weight: 500;
      padding: 0 10px;
      border-radius: 30px;
      line-height: 20px;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    .entry-item:hover {
      background: #eef4ff;
      border-color: #b8cbe5;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(75, 123, 236, 0.08);
    }

    @media (max-width: 700px) {
      .wiki-container {
        padding: 18px 16px 28px;
      }
      .wiki-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .wiki-icon {
        width: 60px;
        height: 60px;
      }
      .guild-title-link h1 {
        font-size: 24px;
      }
      .guild-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 16px 18px;
      }
      .hall-of-fame-link {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 16px 18px;
      }
      .hall-arrow {
        margin-left: 0;
        align-self: flex-end;
      }
      .category-grid {
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }
      .entry-item {
        padding: 8px 12px;
        font-size: 13px;
      }
    }

    @media (max-width: 480px) {
      .wiki-container {
        padding: 12px 10px 24px;
      }
      .category-grid {
        grid-template-columns: 1fr 1fr;
      }
      .entry-item {
        padding: 10px 12px;
      }
      .hall-preview .member-tag {
        font-size: 12px;
        padding: 2px 10px 2px 8px;
      }
    }

    .text-muted {
      color: #7e8a98;
    }
  </style>
</head>
<body>
<div class="wiki-container">
  <header class="wiki-header">
    <div class="wiki-icon">
      <img src="./图片/图标/公会图标.png" alt="堕乐园">
    </div>
    <div class="wiki-title-group">
      <a href="#" class="guild-title-link" id="guildHomeLink">
        <h1>堕乐园</h1>
        <i class="fas fa-chevron-right"> 详情</i>
      </a>
      <div class="sub"><i class="fas fa-tag"></i> Promiscuous Eden</div>
    </div>
  </header>

  <a href="#" class="hall-of-fame-link" id="hallOfFameLink" title="查看完整名人堂">
    <div class="hall-left">
      <i class="fas fa-crown"></i>
      <span class="hall-label">宝藏世界名人堂</span>
    </div>
    <i class="fas fa-chevron-right hall-arrow"></i>
  </a>

  <div class="category-section" id="categorySection"></div>

  <div style="margin-top: 32px; border-top: 1px solid #e8ecf0; padding-top: 16px; font-size: 13px; color: #8a98a8; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
    <span><i class="far fa-copyright"></i> 2023-2077 堕乐园 · PROMISCUOUS EDEN</span>
  </div>

</div>

<script>
  (function() {
    var data = {
      guildHome: {
        name: '堕乐园',
        url: './公会信息.html'
      },
      hallOfFame: {
        name: '宝藏世界名人堂',
        url: './名人堂/名人堂.html'
      },
      categories: [
        {
          title: '工具',
          icon: 'fa-toolbox',
          items: [
            { text: '园艺计算器', url: './工具/园艺计算器.html' },
            { text: '金粉计算器', url: './工具/金粉计算器.html' }
          ]
        },
        {
          title: '时间表',
          icon: 'fa-calendar-check',
          items: [
            { text: '炼金植物时间表', url: './时间表/炼金植物时间表.html' },
            { text: '奢龙试炼时间表', url: './时间表/奢龙试炼时间表.html' }
          ]
        },
        {
          title: '攻略',
          icon: 'fa-book-open',
          items: [
            { text: '装备耗材', url: './攻略/装备耗材.html' },
            { text: '钓鱼地点', url: './攻略/钓鱼地点.html' },
            { text: '登录错误', url: './攻略/登录错误.html' }
          ]
        },
        {
          title: '相关网站',
          icon: 'fa-globe',
          items: [
            { text: 'TroveSaurus', url: 'https://trovesaurus.com/', icon: './图片/图标/社区图标.png' },
            { text: 'TroveWiki', url: 'https://trove.fandom.com/wiki/Trove_Wiki', icon: './图片/图标/宝藏维基图标.webp' },
            { text: 'TroveGame', url: 'https://trovegame.com/patch-notes/patch-notes-radiant-pathfinder-11-2025/', icon: './图片/图标/宝藏文字图标.webp' },
            { text: 'Glyph', url: 'https://glyph.trionworlds.com/', icon: './图片/图标/字形图标.png' },
            { text: 'trove用户条款', url: 'https://www.glyph.net/en/terms-of-use-of-the-glyph-platform/', icon: './图片/图标/字形图标.png' },
            { text: '神秘网站', url: 'https://arcxingye.github.io/r18/index.html', icon: './图片/图标/R18.webp' }
          ]
        },
        {
          title: '游戏',
          icon: 'fa-gamepad',
          items: [
            { text: '贪吃蛇', url: './游戏/贪吃蛇.html' },
            { text: '扫雷', url: './游戏/扫雷.html' }
          ]
        }
      ]
    };

    function isExternalUrl(url) {
      return /^https?:\/\//i.test(url);
    }

    var container = document.getElementById('categorySection');
    if (!container) return;

    var html = '';
    data.categories.forEach(function(cat) {
      html += '<div class="category-block">';
      html += '<div class="category-title"><i class="fas ' + cat.icon + '"></i> ' + cat.title + '</div>';
      html += '<div class="category-grid">';

      cat.items.forEach(function(item) {
        var iconUrl = item.icon || '';
        var iconHtml = '';
        if (iconUrl) {
          iconHtml = '<span class="entry-icon"><img src="' + iconUrl + '" alt="' + item.text + '" onerror="this.style.display=\'none\'"></span>';
        }

        var external = isExternalUrl(item.url);
        var targetAttr = external ? ' target="_blank" rel="noopener noreferrer"' : '';
        html += '<a href="' + item.url + '" class="entry-item"' + targetAttr + '>';
        html += iconHtml;
        html += '<span class="entry-text">' + item.text + '</span>';
        html += '<span class="badge"></span>';
        html += '</a>';
      });

      html += '</div></div>';
    });

    container.innerHTML = html;

    var guildLink = document.getElementById('guildHomeLink');
    if (guildLink) {
      guildLink.href = data.guildHome.url;
    }

    var hallLink = document.getElementById('hallOfFameLink');
    if (hallLink) {
      hallLink.href = data.hallOfFame.url;
    }

  })();
</script>
</body>
</html>
