<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邪神演唱会</title>
    <style>
        body {
            display: flex;
            min-height: 100vh;
            background-color: #121826;
            color: #e0e0e0;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            justify-content: center;
            align-items: center;
        }

        /* 主区域 */
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            background-color: #121826;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* 播放按钮 */
        .play-button {
            background-color: rgb(225, 90, 250);
            color: white;
            border: none;
            border-radius: 50%;
            padding: 100px 100px;
            font-size: 3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(225, 90, 250, 0.3);
        }

        .play-button:hover {
            background-color: rgba(225, 90, 250, 0.8);
            transform: scale(1.05);
            box-shadow: 0 6px 15px rgba(225, 90, 250, 0.4);
        }

    </style>
</head>
<body>
    <div class="main-content">

            <button class="play-button" id="playButton">点击</button>

    </div>
    
    <audio id="audioPlayer" src="../../音频/邪神演唱会.mp3" autoplay loop></audio>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const audioPlayer = document.getElementById('audioPlayer');
            const playButton = document.getElementById('playButton');
            
            // 按钮点击事件
            playButton.addEventListener('click', function() {
                if (audioPlayer.paused) {
                    audioPlayer.play();
                    playButton.textContent = '爽~这才叫音乐！';
                } else {
                    audioPlayer.pause();
                    playButton.textContent = '点击';
                }
            });
            
            // 监听音频播放状态变化
            audioPlayer.addEventListener('play', function() {
                playButton.textContent = '爽~这才叫音乐！';
            });
            
            audioPlayer.addEventListener('pause', function() {
                playButton.textContent = '点击';
            });
        });
    </script>
</body>
</html>
